spring.application.name=QuanLyNHHS

# Tạm thời bỏ qua cấu hình Database để chạy thử web/controller/Thymeleaf
# Khi bạn kết nối tới Oracle Database thực tế, hãy xóa dòng exclude dưới đây và điền thông số spring.datasource.*
spring.autoconfigure.exclude=org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration,org.springframework.boot.hibernate.autoconfigure.HibernateJpaAutoConfiguration
