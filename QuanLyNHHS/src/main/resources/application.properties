spring.application.name=QuanLyNHHS

# Tạm thời bỏ qua cấu hình Database để chạy thử web/controller/Thymeleaf
# Khi bạn kết nối tới Oracle Database thực tế, hãy xóa dòng exclude dưới đây và điền thông số spring.datasource.*
# spring.autoconfigure.exclude=org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration,org.springframework.boot.hibernate.autoconfigure.HibernateJpaAutoConfiguration

# ========================================================
# Oracle Database Configuration (Hoàng Việt Đức - Module Khách hàng & Đặt bàn)
# ========================================================
spring.datasource.url=jdbc:oracle:thin:@localhost:1521/FREE
spring.datasource.username=system
spring.datasource.password=1234
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# JPA / Hibernate settings
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Thymeleaf
spring.thymeleaf.cache=false

# Server
server.port=8080
