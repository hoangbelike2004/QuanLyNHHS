spring.application.name=QuanLyNHHS

# ==============================================================
# CẤU HÌNH KẾT NỐI ORACLE DATABASE FREE (23c Free / 23ai Free / XE)
# ==============================================================
# URL kết nối tới Pluggable Database (mặc định của Oracle 23c Free là FREEPDB1, của XE là XEPDB1)
spring.datasource.url=${DB_URL:jdbc:oracle:thin:@//localhost:1521/FREEPDB1}
spring.datasource.username=${DB_USERNAME:NHHS_APP}
spring.datasource.password=${DB_PASSWORD:nhhs123}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# ==============================================================
# TỰ ĐỘNG TẠO / CẬP NHẬT BẢNG VÀ SEQUENCE TRỰC TIẾP TỪ DỰ ÁN
# ==============================================================
# ddl-auto=update: Khi chạy dự án, Hibernate sẽ tự động so sánh các @Entity trong code
# (LOAI_MON, MON_AN, NHAN_VIEN,...) và tự sinh bảng + sequence trong Oracle nếu chưa có.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.generate-ddl=true
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect

# Hiển thị câu lệnh SQL được Hibernate thực thi trên Console
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.highlight_sql=true
