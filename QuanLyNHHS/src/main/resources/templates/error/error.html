<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lỗi — Nhà hàng Hải Sản</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .error-box { max-width: 540px; margin: 100px auto; text-align: center; }
        .error-icon { font-size: 5rem; color: #dc3545; }
    </style>
</head>
<body>
<div class="error-box">
    <div class="error-icon"><i class="bi bi-exclamation-triangle-fill"></i></div>
    <h2 class="mt-3 fw-bold" th:text="${status} + ' — ' + ${error}">Lỗi</h2>
    <p class="text-muted" th:text="${message}">Đã xảy ra lỗi không mong muốn.</p>
    <hr>
    <a href="/" class="btn btn-primary me-2"><i class="bi bi-house me-1"></i> Trang chủ</a>
    <a href="javascript:history.back()" class="btn btn-outline-secondary"><i class="bi bi-arrow-left me-1"></i> Quay lại</a>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
