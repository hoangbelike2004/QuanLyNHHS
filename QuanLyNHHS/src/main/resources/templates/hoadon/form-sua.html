
<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sửa hóa đơn</title>

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            color: #263445;
        }

        header {
            background: #17365d;
            color: white;
            padding: 22px 5%;
        }

        header h1 { margin: 0 0 14px; }

        nav { display: flex; gap: 20px; flex-wrap: wrap; }

        nav a { color: white; text-decoration: none; }

        main {
            max-width: 950px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .panel {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 8px #0000000c;
            margin-bottom: 20px;
        }

        h2 { margin-top: 0; }

        .description {
            color: #667085;
            font-size: 14px;
            margin-bottom: 22px;
        }

        .form-group { margin-bottom: 18px; }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 7px;
        }

        input, select {
            width: 100%;
            padding: 11px;
            border: 1px solid #d5dce5;
            border-radius: 6px;
            font-size: 15px;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #1769aa;
        }

        input[readonly] {
            background: #f0f4f8;
            color: #667085;
        }

        .status {
            display: inline-block;
            padding: 6px 10px;
            border-radius: 12px;
            background: #fff0cf;
            color: #8a5a00;
            font-size: 13px;
        }

        .notice, .error {
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 15px;
        }

        .notice { background: #e2f7e9; color: #176b39; }
        .error { background: #fde8e8; color: #a52222; }

        .dish-row {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr auto;
            gap: 12px;
            align-items: end;
            padding: 15px 0;
            border-bottom: 1px solid #e5e7eb;
        }

        .dish-row .form-group { margin: 0; }

        .line-total {
            font-weight: bold;
            padding: 12px 0;
            min-width: 110px;
        }

        button, .btn {
            padding: 11px 16px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
        }

        .btn-add { background: #1769aa; color: white; }
        .btn-delete { background: #dc3545; color: white; }
        .btn-save { background: #198754; color: white; }
        .btn-cancel { background: #667085; color: white; }

        .summary {
            margin-top: 20px;
            padding: 18px;
            background: #f4f6f9;
            border-radius: 8px;
        }

        .summary p {
            display: flex;
            justify-content: space-between;
            margin: 10px 0;
        }

        .summary .final-total {
            font-size: 20px;
            font-weight: bold;
            color: #198754;
            border-top: 1px solid #d5dce5;
            padding-top: 12px;
        }

        .actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 25px;
        }

        @media (max-width: 650px) {
            .dish-row {
                grid-template-columns: 1fr 1fr;
            }

            .dish-row .dish-select {
                grid-column: 1 / -1;
            }

            main { padding: 0 10px; }
            .panel { padding: 18px; }
        }
    </style>
</head>

<body>

<header>
    <h1>Hệ thống quản lý nhà hàng</h1>
    <nav>
        <a th:href="@{/hoa-don}">Hóa đơn</a>
        <a th:href="@{/bao-cao}">Báo cáo</a>
    </nav>
</header>

<main>
    <section class="panel">

        <h2>Sửa hóa đơn</h2>

        <p class="description">
            Có thể thay đổi thông tin hóa đơn và danh sách món ăn
            khi hóa đơn chưa thanh toán.
        </p>

        <div th:if="${thongBao}" class="notice" th:text="${thongBao}"></div>
        <div th:if="${loi}" class="error" th:text="${loi}"></div>

        <form th:action="@{/hoa-don/sua/{id}(id=${hoaDon.maHd})}"
              th:object="${hoaDon}"
              method="post"
              id="invoiceForm">

            <div class="form-group">
                <label>Mã hóa đơn</label>
                <input type="text" th:value="${hoaDon.maHd}" readonly>
            </div>

            <div class="form-group">
                <label>Trạng thái</label>
                <span class="status" th:text="${hoaDon.trangThai}"></span>
            </div>

            <div class="form-group">
                <label for="maBan">Mã bàn</label>
                <input type="number" id="maBan"
                       th:field="*{maBan}" min="1" required>
            </div>

            <div class="form-group">
                <label for="maNv">Mã nhân viên</label>
                <input type="number" id="maNv"
                       th:field="*{maNv}" min="1" required>
            </div>

            <div class="form-group">
                <label for="maKh">Mã khách hàng</label>
                <input type="number" id="maKh"
                       th:field="*{maKh}" min="1">
            </div>

            <div class="form-group">
                <label for="giamGia">Giảm giá (VNĐ)</label>
                <input type="number" id="giamGia"
                       th:field="*{giamGia}"
                       min="0" step="1" required>
            </div>

            <hr>

            <h3>Danh sách món ăn</h3>

            <div id="dishList">

                <!-- Hiển thị các món đã có trong hóa đơn -->
                <div class="dish-row"
                     th:each="ct : ${danhSachChiTiet}">

                    <div class="form-group dish-select">
                        <label>Món ăn</label>
                        <select name="maMon" class="mon-select"
                                required>
                            <option value="">-- Chọn món --</option>

                            <option th:each="mon : ${danhSachMonAn}"
                                    th:value="${mon.maMon}"
                                    th:text="${mon.tenMon}"
                                    th:attr="data-price=${mon.donGia}"
                                    th:selected="${mon.maMon == ct.id.maMon}">
                            </option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Số lượng</label>
                        <input type="number" name="soLuong"
                               class="quantity"
                               min="0.01" step="0.01"
                               th:value="${ct.soLuong}" required>
                    </div>

                    <div>
                        <label>Thành tiền</label>
                        <div class="line-total">0 VNĐ</div>
                    </div>

                    <div>
                        <button type="button"
                                class="btn-delete"
                                onclick="xoaMon(this)">
                            Xóa
                        </button>
                    </div>
                </div>

            </div>

            <button type="button" class="btn-add"
                    onclick="themMon()">
                + Thêm món
            </button>

            <div class="summary">
                <p>
                    <span>Tổng tiền món ăn:</span>
                    <strong id="tongMon">0 VNĐ</strong>
                </p>

                <p>
                    <span>Giảm giá:</span>
                    <strong id="hienThiGiamGia">0 VNĐ</strong>
                </p>

                <p class="final-total">
                    <span>Tổng thanh toán:</span>
                    <span id="tongThanhToan">0 VNĐ</span>
                </p>
            </div>

            <div class="actions">
                <button type="submit" class="btn-save">
                    Lưu thay đổi
                </button>

                <a class="btn-cancel"
                   th:href="@{/hoa-don/chi-tiet/{id}(id=${hoaDon.maHd})}">
                    Hủy
                </a>

                <a class="btn-cancel" th:href="@{/hoa-don}">
                    Danh sách hóa đơn
                </a>
            </div>

        </form>
    </section>
</main>

<!-- Dữ liệu món ăn lấy từ database -->
<script th:inline="javascript">
    const danhSachMonAn = /*[[${danhSachMonAn}]]*/ [];

    const dishList = document.getElementById("dishList");

    function dinhDangTien(tien) {
        return new Intl.NumberFormat("vi-VN").format(tien) + " VNĐ";
    }

    function taoOptions() {
        let html = '<option value="">-- Chọn món --</option>';

        danhSachMonAn.forEach(mon => {
            html += `
                <option value="${mon.maMon}" data-price="${mon.donGia}">
                    ${mon.tenMon}
                </option>
            `;
        });

        return html;
    }

    function themMon() {
        const row = document.createElement("div");
        row.className = "dish-row";

        row.innerHTML = `
            <div class="form-group dish-select">
                <label>Món ăn</label>
                <select name="maMon" class="mon-select" required>
                    ${taoOptions()}
                </select>
            </div>

            <div class="form-group">
                <label>Số lượng</label>
                <input type="number" name="soLuong"
                       class="quantity"
                       min="0.01" step="0.01"
                       value="1" required>
            </div>

            <div>
                <label>Thành tiền</label>
                <div class="line-total">0 VNĐ</div>
            </div>

            <div>
                <button type="button" class="btn-delete"
                        onclick="xoaMon(this)">
                    Xóa
                </button>
            </div>
        `;

        dishList.appendChild(row);
        tinhTongTien();
    }

    function xoaMon(button) {
        button.closest(".dish-row").remove();
        tinhTongTien();
    }

    function tinhTongTien() {
        let tongMon = 0;

        document.querySelectorAll(".dish-row").forEach(row => {
            const select = row.querySelector(".mon-select");
            const quantity = row.querySelector(".quantity");

            const option = select.options[select.selectedIndex];
            const donGia = Number(option?.dataset.price || 0);
            const soLuong = Number(quantity.value || 0);

            const thanhTien = donGia * soLuong;

            row.querySelector(".line-total").textContent =
                dinhDangTien(thanhTien);

            tongMon += thanhTien;
        });

        const giamGia = Math.max(
            0,
            Number(document.getElementById("giamGia").value || 0)
        );

        const tongThanhToan = Math.max(0, tongMon - giamGia);

        document.getElementById("tongMon").textContent =
            dinhDangTien(tongMon);

        document.getElementById("hienThiGiamGia").textContent =
            dinhDangTien(giamGia);

        document.getElementById("tongThanhToan").textContent =
            dinhDangTien(tongThanhToan);
    }

    document.addEventListener("input", function(event) {
        if (event.target.matches(".quantity, #giamGia")) {
            tinhTongTien();
        }
    });

    document.addEventListener("change", function(event) {
        if (event.target.matches(".mon-select")) {
            tinhTongTien();
        }
    });

    document.getElementById("invoiceForm").addEventListener("submit", function(event) {
        const rows = document.querySelectorAll(".dish-row");

        if (rows.length === 0) {
            event.preventDefault();
            alert("Hóa đơn phải có ít nhất một món ăn!");
            return;
        }

        const seen = new Set();

        for (const row of rows) {
            const maMon = row.querySelector(".mon-select").value;
            const soLuong = Number(row.querySelector(".quantity").value);

            if (!maMon || !Number.isFinite(soLuong) || soLuong <= 0) {
                event.preventDefault();
                alert("Vui lòng chọn món và nhập số lượng hợp lệ!");
                return;
            }

            if (seen.has(maMon)) {
                event.preventDefault();
                alert("Một món ăn chỉ được xuất hiện một lần. Hãy sửa số lượng ở dòng món đã có!");
                return;
            }

            seen.add(maMon);
        }
    });

    tinhTongTien();
</script>

</body>
</html>
