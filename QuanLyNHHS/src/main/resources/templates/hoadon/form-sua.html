
<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sửa hóa đơn</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            color: #263445;
        }

        header {
            background: #17365d;
            color: white;
            padding: 22px 5%;
        }

        header h1 {
            margin: 0 0 14px;
            font-size: 25px;
        }

        nav {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        nav a {
            color: white;
            text-decoration: none;
        }

        main {
            max-width: 750px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .panel {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 8px #0000000c;
        }

        h2 {
            margin-top: 0;
        }

        .description {
            color: #667085;
            font-size: 14px;
            margin-bottom: 22px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 7px;
        }

        input {
            width: 100%;
            padding: 11px;
            border: 1px solid #d5dce5;
            border-radius: 6px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #1769aa;
        }

        input[readonly] {
            background: #f0f4f8;
            color: #667085;
        }

        .status {
            display: inline-block;
            padding: 6px 10px;
            border-radius: 12px;
            background: #fff0cf;
            color: #8a5a00;
            font-size: 13px;
        }

        .notice {
            padding: 12px;
            background: #e2f7e9;
            color: #176b39;
            border-radius: 6px;
            margin-bottom: 15px;
        }

        .error {
            padding: 12px;
            background: #fde8e8;
            color: #a52222;
            border-radius: 6px;
            margin-bottom: 15px;
        }

        .actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 25px;
        }

        button, .btn {
            padding: 11px 16px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
        }

        button {
            background: #198754;
            color: white;
        }

        .btn {
            background: #667085;
            color: white;
        }

        @media (max-width: 600px) {
            main {
                padding: 0 10px;
            }

            .panel {
                padding: 18px;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>Hệ thống quản lý nhà hàng</h1>

    <nav>
        <a th:href="@{/hoa-don}">Hóa đơn</a>
        <a th:href="@{/bao-cao}">Báo cáo</a>
    </nav>
</header>

<main>
    <section class="panel">

        <h2>Sửa hóa đơn</h2>

        <p class="description">
            Chỉ có thể chỉnh sửa hóa đơn chưa thanh toán.
        </p>

        <div th:if="${thongBao}"
             class="notice"
             th:text="${thongBao}">
        </div>

        <div th:if="${loi}"
             class="error"
             th:text="${loi}">
        </div>

        <form th:action="@{/hoa-don/sua/{id}(id=${hoaDon.maHd})}"
              th:object="${hoaDon}"
              method="post">

            <div class="form-group">
                <label>Mã hóa đơn</label>
                <input type="text"
                       th:value="${hoaDon.maHd}"
                       readonly>
            </div>

            <div class="form-group">
                <label>Trạng thái</label>
                <div>
                    <span class="status"
                          th:text="${hoaDon.trangThai}">
                    </span>
                </div>
            </div>

            <div class="form-group">
                <label for="maBan">Mã bàn</label>
                <input type="number"
                       id="maBan"
                       th:field="*{maBan}"
                       min="1"
                       required>
            </div>

            <div class="form-group">
                <label for="maNv">Mã nhân viên</label>
                <input type="number"
                       id="maNv"
                       th:field="*{maNv}"
                       min="1"
                       required>
            </div>

            <div class="form-group">
                <label for="maKh">Mã khách hàng</label>
                <input type="number"
                       id="maKh"
                       th:field="*{maKh}"
                       min="1">
            </div>

            <div class="form-group">
                <label for="giamGia">Giảm giá (VNĐ)</label>
                <input type="number"
                       id="giamGia"
                       th:field="*{giamGia}"
                       min="0"
                       step="0.01"
                       required>
            </div>

            <div class="form-group">
                <label>Tổng tiền hiện tại (VNĐ)</label>
                <input type="text"
                       th:value="${hoaDon.tongTien}"
                       readonly>
            </div>

            <div class="actions">
                <button type="submit">
                    Lưu thay đổi
                </button>

                <a class="btn"
                   th:href="@{/hoa-don/chi-tiet/{id}(id=${hoaDon.maHd})}">
                    Hủy
                </a>

                <a class="btn" th:href="@{/hoa-don}">
                    Danh sách hóa đơn
                </a>
            </div>

        </form>
    </section>
</main>

</body>
</html>
