
<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Chi tiết hóa đơn</title>
    <style>
        body { margin: 0; font-family: Arial, sans-serif; background: #f4f6f9; color: #263445; }
        header { background: #17365d; color: white; padding: 22px 5%; }
        header a { color: white; text-decoration: none; margin-right: 18px; }
        main { max-width: 1000px; margin: 30px auto; padding: 0 18px; }
        .panel { background: white; padding: 24px; border-radius: 10px; margin-bottom: 18px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; }
        .item { padding: 14px; background: #f4f6f9; border-radius: 8px; }
        .item strong { display: block; margin-bottom: 8px; color: #667085; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #e7ebf0; }
        th { background: #f0f4f8; }
        .btn, button { display: inline-block; padding: 11px 15px; border: 0; border-radius: 6px; color: white; background: #1769aa; text-decoration: none; cursor: pointer; }
        .green { background: #198754; }
        .notice { padding: 12px; background: #e2f7e9; color: #176b39; border-radius: 6px; }
        .error { padding: 12px; background: #fde8e8; color: #a52222; border-radius: 6px; }
        .actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 20px; }
    </style>
</head>
<body>
<header>
    <h1>Quản lý nhà hàng</h1>
    <a th:href="@{/hoa-don}">Danh sách hóa đơn</a>
    <a th:href="@{/bao-cao}">Báo cáo</a>
</header>

<main>
    <section class="panel">
        <h2>Chi tiết hóa đơn #<span th:text="${hoaDon.maHd}"></span></h2>

        <div th:if="${thongBao}" class="notice" th:text="${thongBao}"></div>
        <div th:if="${loi}" class="error" th:text="${loi}"></div>

        <div class="grid">
            <div class="item">
                <strong>Mã bàn</strong>
                <span th:text="${hoaDon.maBan}"></span>
            </div>
            <div class="item">
                <strong>Mã nhân viên</strong>
                <span th:text="${hoaDon.maNv}"></span>
            </div>
            <div class="item">
                <strong>Mã khách hàng</strong>
                <span th:text="${hoaDon.maKh != null ? hoaDon.maKh : '-'}"></span>
            </div>
            <div class="item">
                <strong>Ngày lập</strong>
                <span th:text="${hoaDon.ngayLap}"></span>
            </div>
            <div class="item">
                <strong>Trạng thái</strong>
                <span th:text="${hoaDon.trangThai}"></span>
            </div>
            <div class="item">
                <strong>Giảm giá</strong>
                <span th:text="${hoaDon.giamGia} + ' đ'"></span>
            </div>
            <div class="item">
                <strong>Tổng tiền</strong>
                <span th:text="${hoaDon.tongTien} + ' đ'"></span>
            </div>
        </div>

        <h3>Chi tiết món ăn</h3>
        <table>
            <thead>
            <tr>
                <th>Mã món</th>
                <th>Số lượng</th>
                <th>Đơn giá</th>
                <th>Thành tiền</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="ct : ${danhSachChiTiet}">
                <td th:text="${ct.maMon}"></td>
                <td th:text="${ct.soLuong}"></td>
                <td th:text="${ct.donGia} + ' đ'"></td>
                <td th:text="${ct.thanhTien} + ' đ'"></td>
            </tr>
            <tr th:if="${#lists.isEmpty(danhSachChiTiet)}">
                <td colspan="4" style="text-align:center;padding:25px">
                    Hóa đơn chưa có chi tiết món ăn.
                </td>
            </tr>
            </tbody>
        </table>

        <div class="actions">
            <form th:if="${hoaDon.trangThai != 'Da thanh toan'}"
                  th:action="@{/hoa-don/thanh-toan/{id}(id=${hoaDon.maHd})}"
                  method="post">
                <button class="green" type="submit">Thanh toán hóa đơn</button>
            </form>
            <a class="btn" th:href="@{/hoa-don}">Quay lại danh sách</a>
        </div>
    </section>
</main>
</body>
</html>
