<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Đăng nhập - Hải Sản Hoàng Gia</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        body { min-height: 100vh; display: grid; place-items: center; padding: 20px; }
        .login-card { width: min(100%, 380px); padding: 28px; background: var(--bg-card);
            border: 1px solid var(--border-light); }
        .login-card h1 { font-size: 23px; margin: 0 0 6px; }
        .login-card p { color: var(--text-muted); margin: 0 0 22px; }
        .login-card label { display: block; margin: 14px 0 6px; }
        .login-card input { width: 100%; padding: 10px; background: #fff; color: #182536;
            border: 1px solid var(--border-light); border-radius: 4px; }
        .login-card button { width: 100%; margin-top: 20px; }
        .login-error { color: #ffb2b2 !important; margin-top: 14px !important; }
    </style>
</head>
<body>
    <main class="login-card">
        <h1>Hải Sản Hoàng Gia</h1>
        <p>Đăng nhập để quản lý đặt bàn và hóa đơn.</p>
        <form th:action="@{/login}" method="post">
            <label for="username">Tài khoản</label>
            <input id="username" name="username" autocomplete="username" required autofocus>
            <label for="password">Mật khẩu</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required>
            <button class="btn-primary" type="submit">Đăng nhập</button>
        </form>
        <p th:if="${param.error}" class="login-error">Tài khoản hoặc mật khẩu không đúng.</p>
        <p th:if="${param.logout}">Đã đăng xuất.</p>
    </main>
</body>
</html>
