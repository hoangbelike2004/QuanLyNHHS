<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle} + ' - Nhà hàng Hải Sản'">Bàn ăn</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .navbar-brand { font-weight: 700; color: #0d6efd !important; }
        .table-hover tbody tr:hover { background-color: #e8f4fd; }
        .page-header { border-bottom: 2px solid #0d6efd; padding-bottom: 10px; margin-bottom: 20px; }
        .card-ban { transition: transform .15s; cursor: default; }
        .card-ban:hover { transform: translateY(-2px); }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
    <div class="container">
        <a class="navbar-brand" href="/"><i class="bi bi-fish"></i> Nhà hàng Hải Sản</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navMenu">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="/khach-hang"><i class="bi bi-people"></i> Khách hàng</a></li>
                <li class="nav-item"><a class="nav-link active fw-semibold" href="/ban-an"><i class="bi bi-grid"></i> Bàn ăn</a></li>
                <li class="nav-item"><a class="nav-link" href="/dat-ban"><i class="bi bi-calendar-check"></i> Đặt bàn</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <div class="page-header d-flex justify-content-between align-items-center">
        <h3 class="text-primary mb-0"><i class="bi bi-grid-fill me-2"></i>Danh sách Bàn ăn</h3>
        <a href="/ban-an/them" class="btn btn-primary">
            <i class="bi bi-plus-circle me-1"></i> Thêm bàn ăn
        </a>
    </div>

    <!-- Thông báo -->
    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show">
        <i class="bi bi-check-circle-fill me-1"></i><span th:text="${successMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show">
        <i class="bi bi-exclamation-triangle-fill me-1"></i><span th:text="${errorMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <!-- Lọc theo trạng thái -->
    <div class="card mb-3 shadow-sm">
        <div class="card-body py-2">
            <div class="d-flex gap-2 flex-wrap align-items-center">
                <span class="fw-semibold me-1">Lọc theo trạng thái:</span>
                <a th:href="@{/ban-an}" class="btn btn-sm"
                   th:classappend="${trangThaiFilter == null} ? 'btn-primary' : 'btn-outline-secondary'">Tất cả</a>
                <a th:href="@{/ban-an(trangThai='Trống')}" class="btn btn-sm"
                   th:classappend="${trangThaiFilter == 'Trống'} ? 'btn-success' : 'btn-outline-success'">🟢 Trống</a>
                <a th:href="@{/ban-an(trangThai='Đã đặt')}" class="btn btn-sm"
                   th:classappend="${trangThaiFilter == 'Đã đặt'} ? 'btn-warning' : 'btn-outline-warning'">🟡 Đã đặt</a>
                <a th:href="@{/ban-an(trangThai='Đang dùng')}" class="btn btn-sm"
                   th:classappend="${trangThaiFilter == 'Đang dùng'} ? 'btn-danger' : 'btn-outline-danger'">🔴 Đang dùng</a>
            </div>
        </div>
    </div>

    <!-- Bảng danh sách -->
    <div class="card shadow-sm">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover table-striped mb-0">
                    <thead class="table-primary">
                    <tr>
                        <th>#</th>
                        <th>Mã bàn</th>
                        <th>Tên bàn</th>
                        <th class="text-center">Số chỗ</th>
                        <th>Khu vực</th>
                        <th class="text-center">Trạng thái</th>
                        <th class="text-center">Hành động</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:if="${#lists.isEmpty(danhSachBan)}">
                        <td colspan="7" class="text-center py-4 text-muted">
                            <i class="bi bi-inbox fs-4 d-block mb-2"></i> Chưa có bàn ăn nào.
                        </td>
                    </tr>
                    <tr th:each="ban, stat : ${danhSachBan}">
                        <td th:text="${stat.index + 1}"></td>
                        <td><span class="badge bg-secondary" th:text="${ban.maBan}"></span></td>
                        <td class="fw-semibold" th:text="${ban.tenBan}"></td>
                        <td class="text-center">
                            <i class="bi bi-person-fill"></i>
                            <span th:text="${ban.soCho}"></span>
                        </td>
                        <td th:text="${ban.khuVuc}"></td>
                        <td class="text-center">
                            <span class="badge"
                                  th:classappend="${ban.trangThai == 'Trống'} ? 'bg-success' :
                                                  (${ban.trangThai == 'Đã đặt'} ? 'bg-warning text-dark' : 'bg-danger')"
                                  th:text="${ban.trangThai}"></span>
                        </td>
                        <td class="text-center">
                            <a th:href="@{/ban-an/sua/{maBan}(maBan=${ban.maBan})}"
                               class="btn btn-sm btn-outline-warning me-1">
                                <i class="bi bi-pencil"></i>
                            </a>
                            <form th:action="@{/ban-an/xoa/{maBan}(maBan=${ban.maBan})}" method="post"
                                  class="d-inline"
                                  onsubmit="return confirm('Bạn có chắc muốn xóa bàn này?');">
                                <button type="submit" class="btn btn-sm btn-outline-danger">
                                    <i class="bi bi-trash"></i>
                                </button>
                            </form>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
        <div class="card-footer text-muted small">
            Tổng: <strong th:text="${#lists.size(danhSachBan)}">0</strong> bàn
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
