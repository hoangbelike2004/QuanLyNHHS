<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle} + ' - Nhà hàng Hải Sản'">Form Bàn ăn</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>body { background-color: #f8f9fa; } .navbar-brand { font-weight:700; color:#0d6efd !important; } .form-label { font-weight:500; }</style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
    <div class="container">
        <a class="navbar-brand" href="/"><i class="bi bi-fish"></i> Nhà hàng Hải Sản</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="/khach-hang"><i class="bi bi-people"></i> Khách hàng</a></li>
                <li class="nav-item"><a class="nav-link active fw-semibold" href="/ban-an"><i class="bi bi-grid"></i> Bàn ăn</a></li>
                <li class="nav-item"><a class="nav-link" href="/dat-ban"><i class="bi bi-calendar-check"></i> Đặt bàn</a></li>
            </ul>
        </div>
    </div>
</nav>
<div class="container mt-4">
    <nav aria-label="breadcrumb" class="mb-3">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a href="/ban-an">Bàn ăn</a></li>
            <li class="breadcrumb-item active" th:text="${pageTitle}"></li>
        </ol>
    </nav>
    <div class="row justify-content-center">
        <div class="col-md-7">
            <div class="card shadow-sm">
                <div class="card-header bg-primary text-white">
                    <h5 class="mb-0"><i class="bi bi-grid-fill me-2"></i><span th:text="${pageTitle}">Form Bàn ăn</span></h5>
                </div>
                <div class="card-body">
                    <div th:if="${errorMessage}" class="alert alert-danger">
                        <i class="bi bi-exclamation-triangle-fill me-1"></i><span th:text="${errorMessage}"></span>
                    </div>
                    <form th:object="${banAn}"
                          th:action="${isEdit} ? @{/ban-an/sua/{id}(id=${banAn.maBan})} : @{/ban-an/them}"
                          method="post" class="needs-validation" novalidate>

                        <!-- Tên bàn -->
                        <div class="mb-3">
                            <label class="form-label" for="tenBan">Tên bàn <span class="text-danger">*</span></label>
                            <input type="text" id="tenBan" class="form-control" th:field="*{tenBan}"
                                   placeholder="Ví dụ: Bàn 01" required maxlength="50">
                        </div>

                        <!-- Số chỗ ngồi -->
                        <div class="mb-3">
                            <label class="form-label" for="soCho">Số chỗ ngồi <span class="text-danger">*</span></label>
                            <input type="number" id="soCho" class="form-control" th:field="*{soCho}"
                                   min="1" max="50" placeholder="Ví dụ: 4" required>
                        </div>

                        <!-- Khu vực -->
                        <div class="mb-3">
                            <label class="form-label" for="khuVuc">Khu vực</label>
                            <select id="khuVuc" class="form-select" th:field="*{khuVuc}">
                                <option value="">-- Chọn khu vực --</option>
                                <option value="Tầng 1">Tầng 1</option>
                                <option value="Tầng 2">Tầng 2</option>
                                <option value="Sân vườn">Sân vườn</option>
                                <option value="Phòng VIP">Phòng VIP</option>
                            </select>
                        </div>

                        <!-- Trạng thái -->
                        <div class="mb-3">
                            <label class="form-label" for="trangThai">Trạng thái <span class="text-danger">*</span></label>
                            <select id="trangThai" class="form-select" th:field="*{trangThai}" required>
                                <option value="">-- Chọn trạng thái --</option>
                                <option value="Trống">🟢 Trống</option>
                                <option value="Đã đặt">🟡 Đã đặt</option>
                                <option value="Đang dùng">🔴 Đang dùng</option>
                            </select>
                        </div>

                        <div class="d-flex gap-2 justify-content-end">
                            <a href="/ban-an" class="btn btn-outline-secondary"><i class="bi bi-arrow-left me-1"></i> Quay lại</a>
                            <button type="submit" class="btn btn-primary">
                                <i class="bi bi-save me-1"></i>
                                <span th:text="${isEdit} ? 'Cập nhật' : 'Thêm mới'">Lưu</span>
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
