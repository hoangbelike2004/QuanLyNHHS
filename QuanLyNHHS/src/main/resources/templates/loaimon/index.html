<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danh Mục Loại Món - Hải Sản Hoàng Gia</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/danh-muc.css}">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar Fragment -->
        <div th:replace="~{layout/sidebar :: sidebar}"></div>

        <!-- Main Wrapper -->
        <main class="main-wrapper">
            <!-- Navbar Fragment -->
            <div th:replace="~{layout/navbar :: navbar('Loại món', 'fa-solid fa-layer-group')}"></div>

            <div class="content-body">
                <p class="module-message success" role="status" th:if="${successMessage}" th:text="${successMessage}"></p>
                <p class="module-message error" role="alert" th:if="${errorMessage}" th:text="${errorMessage}"></p>
                <!-- Metrics Row -->
                <div class="metrics-grid">
                    <div class="metric-card cyan">
                        <div class="metric-icon cyan">
                            <i class="fa-solid fa-tags"></i>
                        </div>
                        <div class="metric-info">
                            <h3 th:text="${totalCategories}"></h3>
                            <p>Tổng số danh mục loại món</p>
                        </div>
                    </div>

                    <div class="metric-card emerald">
                        <div class="metric-icon emerald">
                            <i class="fa-solid fa-shrimp"></i>
                        </div>
                        <div class="metric-info">
                            <h3 th:text="${totalDishesInCategories}"></h3>
                            <p>Tổng số món thuộc các loại</p>
                        </div>
                    </div>
                </div>

                <!-- Toolbar & Actions -->
                <div class="toolbar-section">
                    <div class="toolbar-left">
                        <div class="search-box">
                            <i class="fa-solid fa-magnifying-glass"></i>
                            <input type="text" id="searchCategoryInput" placeholder="Tìm tên loại món, mã loại...">
                        </div>
                    </div>

                    <div class="toolbar-right">
                        <a class="btn-primary" th:href="@{/loai-mon/them}">
                            <i class="fa-solid fa-plus"></i>
                            <span>Thêm loại món</span>
                        </a>
                    </div>
                </div>

                <!-- Table Categories List -->
                <div class="table-responsive">
                    <table class="custom-table">
                        <thead>
                            <tr>
                                <th>Mã Loại</th>
                                <th>Tên Loại Món</th>
                                <th>Mô Tả Danh Mục</th>
                                <th>Số Món Đang Có</th>
                                <th>Trạng Thái</th>
                                <th style="text-align: right;">Thao Tác</th>
                            </tr>
                        </thead>
                        <tbody id="categoryTableBody">
                            <tr th:each="cat : ${categories}" data-category-row>
                                <td style="font-weight: 700; color: var(--cyan-primary);" th:text="${cat.maLoai}"></td>
                                <td>
                                    <div style="font-weight: 600; color: var(--text-main); font-size: 14.5px;" th:text="${cat.tenLoai}"></div>
                                </td>
                                <td style="color: var(--text-muted); max-width: 320px;" th:text="${cat.moTa}"></td>
                                <td>
                                    <span class="badge-role service" th:text="${(dishCounts[cat.maLoai] ?: 0) + ' món'}"></span>
                                </td>
                                <td>
                                    <span class="dish-badge-status badge-serving" style="position: static;" th:text="${cat.trangThai}"></span>
                                </td>
                                <td style="text-align: right;">
                                    <div style="display: inline-flex; gap: 8px;">
                                        <a class="btn-action edit" title="Sửa" th:href="@{/loai-mon/sua/{id}(id=${cat.maLoai})}" aria-label="Sửa loại món">
                                            <i class="fa-solid fa-pen-to-square"></i>
                                        </a>
                                        <form class="inline-delete" th:action="@{/loai-mon/xoa/{id}(id=${cat.maLoai})}" method="post" onsubmit="return confirm('Bạn có chắc muốn xóa bản ghi này?');">
                                            <button class="btn-action delete" type="submit" title="Xóa" aria-label="Xóa loại món"><i class="fa-solid fa-trash-can"></i></button>
                                        </form>
                                    </div>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(categories)}"><td colspan="6">Chưa có loại món.</td></tr>
                        </tbody>
                    </table>
                </div>

            </div>
        </main>
    </div>

    <!-- Dùng chung biểu mẫu thêm/sửa; lỗi kiểm tra giữ lại dữ liệu vừa nhập. -->
    <div class="modal-overlay active" th:if="${showForm == true}">
        <section class="modal-box" role="dialog" aria-modal="true" aria-labelledby="edit-title">
            <div class="modal-header">
                <h3 id="edit-title" th:text="${editingId == null ? 'Thêm loại món' : 'Sửa loại món'}"></h3>
                <a class="modal-close" th:href="@{/loai-mon}" aria-label="Đóng"><i class="fa-solid fa-xmark"></i></a>
            </div>
            <form th:action="@{${formAction}}" th:object="${form}" method="post">
                <div class="modal-body">
                    <div class="module-message error" role="alert" th:if="${#fields.hasGlobalErrors()}">
                        <p th:each="error : ${#fields.globalErrors()}" th:text="${error}"></p>
                    </div>
                    <p th:if="${editingId != null}">Mã: <strong th:text="${editingId}"></strong></p>
                    <div class="form-group">
                        <label for="tenLoai">Tên loại món</label>
                        <input type="text" id="tenLoai" th:field="*{tenLoai}" required maxlength="100" th:attr="aria-invalid=${#fields.hasErrors('tenLoai')}">
                        <small class="field-error" th:if="${#fields.hasErrors('tenLoai')}" th:errors="*{tenLoai}"></small>
                    </div>
                    <div class="form-group">
                        <label for="trangThai">Trạng thái</label>
                        <select id="trangThai" th:field="*{trangThai}" required th:attr="aria-invalid=${#fields.hasErrors('trangThai')}"><option value="Hoạt động">Hoạt động</option><option value="Tạm dừng">Tạm dừng</option></select>
                        <small class="field-error" th:if="${#fields.hasErrors('trangThai')}" th:errors="*{trangThai}"></small>
                    </div>
                    <div class="form-group">
                        <label for="moTa">Mô tả</label>
                        <textarea id="moTa" th:field="*{moTa}" maxlength="255" rows="3" th:attr="aria-invalid=${#fields.hasErrors('moTa')}"></textarea>
                        <small class="field-error" th:if="${#fields.hasErrors('moTa')}" th:errors="*{moTa}"></small>
                    </div>
                </div>
                <div class="modal-footer">
                    <a class="btn-secondary" th:href="@{/loai-mon}">Hủy</a>
                    <button type="submit" class="btn-primary"><i class="fa-solid fa-check"></i><span>Lưu loại món</span></button>
                </div>
            </form>
        </section>
    </div>

    <!-- Scripts -->
    <script th:src="@{/js/main.js}"></script>
</body>
</html>
