<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Thực Đơn Hải Sản - Hải Sản Hoàng Gia</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/danh-muc.css}">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar Fragment -->
        <div th:replace="~{layout/sidebar :: sidebar}"></div>

        <!-- Main Wrapper -->
        <main class="main-wrapper">
            <!-- Navbar Fragment -->
            <div th:replace="~{layout/navbar :: navbar('Món ăn', 'fa-solid fa-utensils')}"></div>

            <div class="content-body">
                <p class="module-message success" role="status" th:if="${successMessage}" th:text="${successMessage}"></p>
                <p class="module-message error" role="alert" th:if="${errorMessage}" th:text="${errorMessage}"></p>
                <!-- Metrics Row -->
                <div class="metrics-grid">
                    <div class="metric-card cyan">
                        <div class="metric-icon cyan">
                            <i class="fa-solid fa-bowl-food"></i>
                        </div>
                        <div class="metric-info">
                            <h3 th:text="${totalDishes}"></h3>
                            <p>Tổng số món trong menu</p>
                        </div>
                    </div>

                    <div class="metric-card emerald">
                        <div class="metric-icon emerald">
                            <i class="fa-solid fa-circle-check"></i>
                        </div>
                        <div class="metric-info">
                            <h3 th:text="${servingDishes}"></h3>
                            <p>Món đang phục vụ</p>
                        </div>
                    </div>

                    <div class="metric-card rose">
                        <div class="metric-icon rose">
                            <i class="fa-solid fa-box-open"></i>
                        </div>
                        <div class="metric-info">
                            <h3 th:text="${outOfStockDishes}"></h3>
                            <p>Món tạm hết hàng</p>
                        </div>
                    </div>
                </div>

                <!-- Toolbar & Filters -->
                <div class="toolbar-section">
                    <div class="toolbar-left">
                        <!-- Search Box -->
                        <div class="search-box">
                            <i class="fa-solid fa-magnifying-glass"></i>
                            <input type="text" id="searchDishInput" placeholder="Tìm tên món hoặc mã món ăn...">
                        </div>

                        <!-- Category Filter Pills -->
                        <div class="filter-pills">
                            <button class="pill-btn active" data-category="all">Tất cả</button>
                            <button class="pill-btn" th:each="cat : ${categories}"
                                    th:data-category="${cat.maLoai}"
                                    th:text="${cat.tenLoai}"></button>
                        </div>
                    </div>

                    <div class="toolbar-right">
                        <!-- View Toggle -->
                        <div class="view-toggle">
                            <button class="toggle-btn" id="btnGridView" title="Dạng lưới thẻ">
                                <i class="fa-solid fa-table-cells-large"></i>
                            </button>
                            <button class="toggle-btn active" id="btnTableView" title="Dạng danh sách bảng">
                                <i class="fa-solid fa-list-ul"></i>
                            </button>
                        </div>

                        <!-- Add Dish Button -->
                        <a class="btn-primary" th:href="@{/mon-an/them}">
                            <i class="fa-solid fa-plus"></i>
                            <span>Thêm món ăn</span>
                        </a>
                    </div>
                </div>

                <!-- 1. Grid Cards View -->
                <div class="dishes-grid" id="dishGridContainer" style="display: none;">
                    <p th:if="${#lists.isEmpty(dishes)}">Chưa có món ăn.</p>
                    <div class="dish-card" th:each="dish : ${dishes}" th:data-category="${dish.maLoai}">
                        <div class="dish-image-wrapper">
                            <img th:if="${not #strings.isEmpty(dish.hinhAnh)}" th:src="${dish.hinhAnh}" th:alt="${dish.tenMon}" class="dish-image">
                            <span class="dish-category-tag" th:text="${dish.tenLoai}"></span>
                            <span class="dish-badge-status"
                                  th:classappend="${dish.trangThai == 'Đang phục vụ'} ? 'badge-serving' : 'badge-out'"
                                  th:text="${dish.trangThai ?: 'Chưa cập nhật'}"></span>
                        </div>
                        <div class="dish-content">
                            <div class="dish-header">
                                <div class="dish-code" th:text="${dish.maMon}"></div>
                                <h3 class="dish-title" th:text="${dish.tenMon}"></h3>
                            </div>
                            <p class="dish-desc" th:text="${dish.moTa}"></p>
                            <div class="dish-footer">
                                <div>
                                    <span class="dish-price" th:text="${dish.donGia != null ? #numbers.formatDecimal(dish.donGia, 0, 'COMMA', 0, 'POINT') + ' đ' : 'Chưa cập nhật'}"></span>
                                    <span class="dish-unit" th:text="'/ ' + ${dish.donViTinh}"></span>
                                </div>
                                <div class="dish-actions">
                                    <a class="btn-action edit" title="Sửa" th:href="@{/mon-an/sua/{id}(id=${dish.maMon})}" aria-label="Sửa món ăn">
                                        <i class="fa-solid fa-pen-to-square"></i>
                                    </a>
                                    <form class="inline-delete" th:action="@{/mon-an/xoa/{id}(id=${dish.maMon})}" method="post" onsubmit="return confirm('Bạn có chắc muốn xóa bản ghi này?');">
                                            <button class="btn-action delete" type="submit" title="Xóa" aria-label="Xóa món ăn"><i class="fa-solid fa-trash-can"></i></button>
                                        </form>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 2. Table List View (Hidden by default) -->
                <div class="table-responsive" id="dishTableContainer">
                    <table class="custom-table">
                        <thead>
                            <tr>
                                <th>Mã Món</th>
                                <th>Ảnh Món</th>
                                <th>Tên Món Ăn</th>
                                <th>Loại Món</th>
                                <th>Đơn Vị</th>
                                <th>Đơn Giá</th>
                                <th>Trạng Thái</th>
                                <th>Đã Bán</th>
                                <th style="text-align: right;">Thao Tác</th>
                            </tr>
                        </thead>
                        <tbody id="dishTableBody">
                            <tr th:each="dish : ${dishes}" th:data-category="${dish.maLoai}">
                                <td style="font-weight: 600; color: var(--text-dim);" th:text="${dish.maMon}"></td>
                                <td>
                                    <img th:if="${not #strings.isEmpty(dish.hinhAnh)}" th:src="${dish.hinhAnh}" th:alt="${dish.tenMon}" class="table-avatar">
                                </td>
                                <td>
                                    <div style="font-weight: 600; color: var(--text-main);" th:text="${dish.tenMon}"></div>
                                    <div style="font-size: 11.5px; color: var(--text-dim);" th:text="${dish.moTa}"></div>
                                </td>
                                <td>
                                    <span class="badge-role service" th:text="${dish.tenLoai}"></span>
                                </td>
                                <td th:text="${dish.donViTinh}"></td>
                                <td style="font-weight: 700; color: var(--gold-accent);"
                                    th:text="${dish.donGia != null ? #numbers.formatDecimal(dish.donGia, 0, 'COMMA', 0, 'POINT') + ' đ' : 'Chưa cập nhật'}"></td>
                                <td>
                                    <span class="dish-badge-status"
                                          th:classappend="${dish.trangThai == 'Đang phục vụ'} ? 'badge-serving' : 'badge-out'"
                                          th:text="${dish.trangThai ?: 'Chưa cập nhật'}" style="position: static;"></span>
                                </td>
                                <td th:text="${soldQuantities[dish.maMon] ?: 0}"></td>
                                <td style="text-align: right;">
                                    <div style="display: inline-flex; gap: 6px;">
                                        <a class="btn-action edit" title="Sửa" th:href="@{/mon-an/sua/{id}(id=${dish.maMon})}" aria-label="Sửa món ăn">
                                            <i class="fa-solid fa-pen-to-square"></i>
                                        </a>
                                        <form class="inline-delete" th:action="@{/mon-an/xoa/{id}(id=${dish.maMon})}" method="post" onsubmit="return confirm('Bạn có chắc muốn xóa bản ghi này?');">
                                            <button class="btn-action delete" type="submit" title="Xóa" aria-label="Xóa món ăn"><i class="fa-solid fa-trash-can"></i></button>
                                        </form>
                                    </div>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(dishes)}"><td colspan="9">Chưa có món ăn.</td></tr>
                        </tbody>
                    </table>
                </div>

            </div>
        </main>
    </div>

    <!-- Dùng chung biểu mẫu thêm/sửa; lỗi kiểm tra giữ lại dữ liệu vừa nhập. -->
    <div class="modal-overlay active" th:if="${showForm == true}">
        <section class="modal-box" role="dialog" aria-modal="true" aria-labelledby="edit-title">
            <div class="modal-header">
                <h3 id="edit-title" th:text="${editingId == null ? 'Thêm món ăn' : 'Sửa món ăn'}"></h3>
                <a class="modal-close" th:href="@{/mon-an}" aria-label="Đóng"><i class="fa-solid fa-xmark"></i></a>
            </div>
            <form th:action="@{${formAction}}" th:object="${form}" method="post">
                <div class="modal-body">
                    <div class="module-message error" role="alert" th:if="${#fields.hasGlobalErrors()}">
                        <p th:each="error : ${#fields.globalErrors()}" th:text="${error}"></p>
                    </div>
                    <p th:if="${editingId != null}">Mã: <strong th:text="${editingId}"></strong></p>
                    <div class="form-group">
                        <label for="maLoai">Loại món</label>
                        <select id="maLoai" th:field="*{maLoai}" required th:attr="aria-invalid=${#fields.hasErrors('maLoai')}"><option value="">Chọn loại món...</option><option th:each="cat : ${categories}" th:value="${cat.maLoai}" th:text="${cat.tenLoai}"></option></select>
                        <small class="field-error" th:if="${#fields.hasErrors('maLoai')}" th:errors="*{maLoai}"></small>
                    </div>
                    <div class="form-group">
                        <label for="tenMon">Tên món</label>
                        <input type="text" id="tenMon" th:field="*{tenMon}" required maxlength="150" th:attr="aria-invalid=${#fields.hasErrors('tenMon')}">
                        <small class="field-error" th:if="${#fields.hasErrors('tenMon')}" th:errors="*{tenMon}"></small>
                    </div>
                    <div class="form-group">
                        <label for="donVi">Đơn vị tính</label>
                        <input type="text" id="donVi" th:field="*{donVi}" required maxlength="20" th:attr="aria-invalid=${#fields.hasErrors('donVi')}">
                        <small class="field-error" th:if="${#fields.hasErrors('donVi')}" th:errors="*{donVi}"></small>
                    </div>
                    <div class="form-group">
                        <label for="donGia">Đơn giá (VNĐ)</label>
                        <input type="number" id="donGia" th:field="*{donGia}" required min="0" max="9999999999.99" step="0.01" th:attr="aria-invalid=${#fields.hasErrors('donGia')}">
                        <small class="field-error" th:if="${#fields.hasErrors('donGia')}" th:errors="*{donGia}"></small>
                    </div>
                    <div class="form-group">
                        <label for="trangThai">Trạng thái</label>
                        <select id="trangThai" th:field="*{trangThai}" required th:attr="aria-invalid=${#fields.hasErrors('trangThai')}"><option value="Đang phục vụ">Đang phục vụ</option><option value="Tạm hết">Tạm hết</option></select>
                        <small class="field-error" th:if="${#fields.hasErrors('trangThai')}" th:errors="*{trangThai}"></small>
                    </div>
                    <div class="form-group">
                        <label for="hinhAnh">Đường dẫn ảnh</label>
                        <input type="url" id="hinhAnh" th:field="*{hinhAnh}" maxlength="1000" placeholder="https://..." th:attr="aria-invalid=${#fields.hasErrors('hinhAnh')}">
                        <small class="field-error" th:if="${#fields.hasErrors('hinhAnh')}" th:errors="*{hinhAnh}"></small>
                    </div>
                    <div class="form-group">
                        <label for="moTa">Mô tả</label>
                        <textarea id="moTa" th:field="*{moTa}" maxlength="1000" rows="3" th:attr="aria-invalid=${#fields.hasErrors('moTa')}"></textarea>
                        <small class="field-error" th:if="${#fields.hasErrors('moTa')}" th:errors="*{moTa}"></small>
                    </div>
                </div>
                <div class="modal-footer">
                    <a class="btn-secondary" th:href="@{/mon-an}">Hủy</a>
                    <button type="submit" class="btn-primary"><i class="fa-solid fa-check"></i><span>Lưu món ăn</span></button>
                </div>
            </form>
        </section>
    </div>

    <!-- Scripts -->
    <script th:src="@{/js/main.js}"></script>
</body>
</html>
