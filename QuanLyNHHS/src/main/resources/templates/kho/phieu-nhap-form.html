<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{kho/fragments :: head('Lập phiếu nhập')}"></head>
  <body>
    <div class="shell">
      <aside th:replace="~{kho/fragments :: nav}"></aside>
      <main>
        <div th:replace="~{kho/fragments :: messages}"></div>
        <header>
          <h1
            th:text="${id == null ? 'Lập phiếu nhập' : 'Sửa phiếu nhập'}"
          ></h1>
          <a th:href="@{/phieu-nhap}">Quay lại danh sách</a>
        </header>
        <form
          method="post"
          class="editor"
          th:object="${form}"
          th:action="${id == null} ? @{/phieu-nhap/them} : @{/phieu-nhap/{id}/sua(id=${id})}"
        >
          <div class="error" role="alert" th:if="${#fields.hasAnyErrors()}">
            <p th:each="e : ${#fields.allErrors()}" th:text="${e}"></p>
          </div>
          <input type="hidden" th:field="*{phienBan}" />
          <div class="fields">
            <label>
              Nhà cung cấp
              <select th:field="*{maNcc}" required>
                <option value="">Chọn nhà cung cấp</option>
                <option
                  th:each="n : ${nhaCungCaps}"
                  th:value="${n.maNcc}"
                  th:text="${n.tenNcc}"
                ></option>
              </select>
            </label>
            <label>
              Nhân viên nhập kho
              <select th:field="*{maNv}" required>
                <option value="">Chọn nhân viên</option>
                <option
                  th:each="n : ${nhanViens}"
                  th:value="${n.maNv}"
                  th:text="${n.hoTen}"
                ></option>
              </select>
            </label>
            <label>
              Ngày nhập
              <input type="date" th:field="*{ngayNhap}" required />
            </label>
          </div>
          <h2>Nguyên liệu nhập</h2>
          <p class="muted">
            Số lượng theo đơn vị đã khai báo của nguyên liệu. Đơn giá tính bằng
            VNĐ.
          </p>
          <div class="table-wrap">
            <table id="receipt-lines">
              <thead>
                <tr>
                  <th>Nguyên liệu · Đơn vị</th>
                  <th class="number">Số lượng</th>
                  <th class="number">Đơn giá (VNĐ)</th>
                  <th>Thao tác</th>
                </tr>
              </thead>
              <tbody>
                <tr th:each="d, stat : *{chiTiet}" data-line>
                  <td>
                    <select
                      th:field="*{chiTiet[__${stat.index}__].maNl}"
                      aria-label="Nguyên liệu"
                      required
                    >
                      <option value="">Chọn nguyên liệu</option>
                      <option
                        th:each="n : ${nguyenLieus}"
                        th:value="${n.maNl}"
                        th:text="${n.tenNl + ' · ' + n.donVi + (n.trangThai == 'HOAT_DONG' ? '' : ' (ngừng sử dụng)')}"
                      ></option>
                    </select>
                  </td>
                  <td>
                    <input
                      class="number"
                      type="number"
                      min="0.01"
                      max="99999999.99"
                      step="0.01"
                      th:field="*{chiTiet[__${stat.index}__].soLuong}"
                      aria-label="Số lượng"
                      required
                    />
                  </td>
                  <td>
                    <input
                      class="number"
                      type="number"
                      min="0"
                      max="9999999999.99"
                      step="0.01"
                      th:field="*{chiTiet[__${stat.index}__].donGia}"
                      aria-label="Đơn giá"
                      required
                    />
                  </td>
                  <td><button type="button" data-remove>Xóa dòng</button></td>
                </tr>
              </tbody>
            </table>
          </div>
          <div class="actions">
            <button type="button" id="add-line">Thêm dòng nguyên liệu</button>
            <button type="submit" class="primary">Lưu phiếu nhập</button>
          </div>
        </form>
      </main>
    </div>
    <script src="/js/kho.js" defer></script>
  </body>
</html>
