<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{kho/fragments :: head('Phiếu nhập')}"></head>
  <body>
    <div class="app-container" th:with="activeMenu='kho'">
      <div th:replace="~{layout/sidebar :: sidebar}"></div>
      <main class="main-wrapper">
        <div th:replace="~{layout/navbar :: navbar('Kho và nhập hàng', 'fa-solid fa-boxes-stacked')}"></div>
        <div class="content-body inventory-module">
          <nav th:replace="~{kho/fragments :: nav}"></nav>
        <div th:replace="~{kho/fragments :: messages}"></div>
        <header>
          <h1>Phiếu nhập</h1>
          <a class="button primary" th:href="@{/phieu-nhap/them}">
            Lập phiếu nhập
          </a>
        </header>
        <p class="muted" th:text="${#lists.size(rows)} + ' phiếu nhập'"></p>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th class="number">Mã phiếu</th>
                <th>Nhà cung cấp</th>
                <th class="number">Mã nhân viên</th>
                <th class="number">Ngày nhập</th>
                <th class="number">Tổng tiền (VNĐ)</th>
                <th>Thao tác</th>
              </tr>
            </thead>
            <tbody>
              <tr th:each="p : ${rows}">
                <td class="number">
                  <a
                    th:href="@{/phieu-nhap/{id}(id=${p.maPn})}"
                    th:text="${p.maPn}"
                  ></a>
                </td>
                <td th:text="${p.nhaCungCap.tenNcc}"></td>
                <td class="number" th:text="${p.maNv}"></td>
                <td class="number" th:text="${p.ngayNhap}"></td>
                <td
                  class="number"
                  th:text="${#numbers.formatDecimal(p.tongTien, 1, 'POINT', 2, 'COMMA')}"
                ></td>
                <td>
                  <a th:href="@{/phieu-nhap/{id}(id=${p.maPn})}">Xem phiếu</a>
                </td>
              </tr>
              <tr th:if="${#lists.isEmpty(rows)}">
                <td colspan="6" class="empty">
                  Chưa có phiếu nhập. Thêm nhà cung cấp và nguyên liệu, sau đó
                  lập phiếu đầu tiên.
                </td>
              </tr>
            </tbody>
          </table>
        </div>
        </div>
      </main>
    </div>
  </body>
</html>
