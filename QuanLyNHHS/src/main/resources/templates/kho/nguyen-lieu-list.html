<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{kho/fragments :: head('Nguyên liệu & Tồn kho')}"></head>
  <body>
    <div class="app-container" th:with="activeMenu='kho'">
      <div th:replace="~{layout/sidebar :: sidebar}"></div>
      <main class="main-wrapper">
        <div th:replace="~{layout/navbar :: navbar('Kho &amp; Nhập Hàng', 'fa-solid fa-boxes-stacked')}"></div>
        <div class="content-body inventory-module">
          <nav th:replace="~{kho/fragments :: nav}"></nav>
        <div th:replace="~{kho/fragments :: messages}"></div>
        <header>
          <h1>Nguyên liệu &amp; Tồn kho</h1>
          <a class="button primary" th:href="@{/nguyen-lieu/them}">
            Thêm nguyên liệu
          </a>
        </header>
        <p class="muted" th:text="${#lists.size(rows)} + ' nguyên liệu'"></p>
        <p>
          Tồn đầu bằng 0. Số lượng tồn thay đổi khi lập, sửa hoặc xóa phiếu
          nhập.
        </p>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Nguyên liệu</th>
                <th>Đơn vị</th>
                <th class="number">Tồn kho</th>
                <th>Trạng thái</th>
                <th>Thao tác</th>
              </tr>
            </thead>
            <tbody>
              <tr th:each="n : ${rows}">
                <td th:text="${n.tenNl}"></td>
                <td th:text="${n.donVi}"></td>
                <td
                  class="number"
                  th:text="${#numbers.formatDecimal(n.soLuongTon, 1, 'POINT', 2, 'COMMA')}"
                ></td>
                <td
                  th:text="${n.trangThai == 'HOAT_DONG' ? 'Hoạt động' : 'Ngừng sử dụng'}"
                ></td>
                <td>
                  <div class="actions">
                    <a th:href="@{/nguyen-lieu/{id}/sua(id=${n.maNl})}">Sửa</a>
                    <form
                      method="post"
                      th:action="@{/nguyen-lieu/{id}/xoa(id=${n.maNl})}"
                      data-confirm="Xóa nguyên liệu này?"
                    >
                      <button class="danger" type="submit">Xóa</button>
                    </form>
                  </div>
                </td>
              </tr>
              <tr th:if="${#lists.isEmpty(rows)}">
                <td colspan="5" class="empty">
                  Chưa có nguyên liệu. Thêm nguyên liệu trước khi lập phiếu
                  nhập.
                </td>
              </tr>
            </tbody>
          </table>
        </div>
        </div>
      </main>
    </div>
    <script th:src="@{/js/kho.js}" defer></script>
  </body>
</html>
