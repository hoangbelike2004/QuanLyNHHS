<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
  <head th:fragment="head(title)">
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title th:text="${title} + ' · Quản lý nhà hàng hải sản'">Kho</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link rel="stylesheet" th:href="@{/css/style.css}" />
    <link rel="stylesheet" th:href="@{/css/kho.css}" />
  </head>
  <body>
    <nav th:fragment="nav" class="inventory-nav" aria-label="Quản lý kho">
        <a th:href="@{/}"><i class="fa-solid fa-house"></i> Trang chủ</a>
        <a th:href="@{/phieu-nhap}">Phiếu nhập</a>
        <a th:href="@{/nguyen-lieu}">Nguyên liệu &amp; Tồn kho</a>
        <a th:href="@{/nha-cung-cap}">Nhà cung cấp</a>
    </nav>
    <div th:fragment="messages">
      <p
        class="success"
        role="status"
        th:if="${success}"
        th:text="${success}"
      ></p>
      <p class="error" role="alert" th:if="${error}" th:text="${error}"></p>
    </div>
  </body>
</html>
