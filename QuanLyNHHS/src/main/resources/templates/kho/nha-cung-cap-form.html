<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{kho/fragments :: head('Thông tin nhà cung cấp')}"></head>
  <body>
    <div class="app-container" th:with="activeMenu='kho'">
      <div th:replace="~{layout/sidebar :: sidebar}"></div>
      <main class="main-wrapper">
        <div th:replace="~{layout/navbar :: navbar('Kho &amp; Nhập Hàng', 'fa-solid fa-boxes-stacked')}"></div>
        <div class="content-body inventory-module">
          <nav th:replace="~{kho/fragments :: nav}"></nav>
        <div th:replace="~{kho/fragments :: messages}"></div>
        <header>
          <h1
            th:text="${id == null ? 'Thêm nhà cung cấp' : 'Sửa nhà cung cấp'}"
          ></h1>
          <a th:href="@{/nha-cung-cap}">Quay lại danh sách</a>
        </header>
        <form
          class="editor"
          method="post"
          th:object="${form}"
          th:action="${id == null} ? @{/nha-cung-cap/them} : @{/nha-cung-cap/{id}/sua(id=${id})}"
        >
          <div class="error" role="alert" th:if="${#fields.hasAnyErrors()}">
            <p th:each="e : ${#fields.allErrors()}" th:text="${e}"></p>
          </div>
          <div class="fields">
            <label>
              Tên nhà cung cấp
              <input
                type="text"
                th:field="*{tenNcc}"
                maxlength="150"
                required
              />
            </label>
            <label>
              Điện thoại
              <input type="tel" th:field="*{sdt}" maxlength="15" />
            </label>
            <label>
              Địa chỉ
              <input type="text" th:field="*{diaChi}" maxlength="200" />
            </label>
            <label>
              Email
              <input type="email" th:field="*{email}" maxlength="100" />
            </label>
          </div>
          <button class="primary" type="submit">Lưu nhà cung cấp</button>
        </form>
        </div>
      </main>
    </div>
  </body>
</html>
