<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Nhân viên - Hải Sản Hoàng Gia</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        .staff-page { max-width: 1100px; margin: 0 auto; }
        .staff-heading { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; margin-bottom: 20px; }
        .staff-heading h1 { font-size: 24px; margin: 0; }
        .staff-heading span { color: var(--text-muted); }
        .staff-add { border: 1px solid var(--border-light); background: var(--bg-card); padding: 18px; margin-bottom: 20px; }
        .staff-add summary { cursor: pointer; font-weight: 600; }
        .staff-form { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 20px; margin-top: 18px; }
        .staff-form label { display: block; font-size: 13px; margin-bottom: 5px; }
        .staff-form input, .staff-form select { width: 100%; padding: 9px 10px; border: 1px solid var(--border-light); border-radius: 4px; background: #fff; color: #182536; }
        .staff-form button { justify-self: start; }
        .staff-table { overflow-x: auto; border: 1px solid var(--border-light); background: var(--bg-card); }
        .staff-message { padding: 12px 14px; margin-bottom: 16px; border: 1px solid var(--border-light); }
        .staff-error { color: #ffb2b2; }
        @media (max-width: 640px) { .staff-form { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
<div class="app-container" th:with="activeMenu='nhanvien'">
    <div th:replace="~{layout/sidebar :: sidebar}"></div>
    <main class="main-wrapper">
        <div th:replace="~{layout/navbar :: navbar('Nhân viên', 'fa-solid fa-user-group')}"></div>
        <div class="content-body">
            <div class="staff-page">
                <div class="staff-heading">
                    <h1>Nhân viên</h1>
                    <span th:text="${totalStaff + ' nhân viên trong hệ thống'}">0 nhân viên trong hệ thống</span>
                </div>
                <p th:if="${successMessage}" class="staff-message" th:text="${successMessage}"></p>
                <p th:if="${errorMessage}" class="staff-message staff-error" th:text="${errorMessage}"></p>

                <details class="staff-add">
                    <summary>Thêm nhân viên</summary>
                    <form class="staff-form" th:action="@{/nhan-vien/them}" method="post">
                        <div><label for="hoTen">Họ tên</label><input id="hoTen" name="hoTen" required maxlength="100"></div>
                        <div><label for="sdt">Số điện thoại</label><input id="sdt" name="sdt" type="tel" maxlength="15"></div>
                        <div><label for="chucVu">Chức vụ</label>
                            <select id="chucVu" name="chucVu" required>
                                <option value="">-- Chọn chức vụ --</option>
                                <option value="Quản lý nhà hàng">Quản lý nhà hàng</option>
                                <option value="Thu ngân">Thu ngân</option>
                                <option value="Nhân viên phục vụ">Nhân viên phục vụ</option>
                                <option value="Lễ tân">Lễ tân</option>
                                <option value="Bếp trưởng">Bếp trưởng</option>
                                <option value="Đầu bếp">Đầu bếp</option>
                            </select>
                        </div>
                        <div><label for="luong">Lương (đ)</label><input id="luong" name="luong" type="number" min="0" step="0.01" required></div>
                        <div><label for="ngayVaoLam">Ngày vào làm</label><input id="ngayVaoLam" name="ngayVaoLam" type="date" required></div>
                        <button class="btn-primary" type="submit">Lưu nhân viên</button>
                    </form>
                </details>

                <div class="staff-table">
                    <table class="custom-table">
                        <thead><tr><th>Mã NV</th><th>Họ tên</th><th>Chức vụ</th><th>Số điện thoại</th><th>Ngày vào làm</th><th style="text-align:right">Lương</th></tr></thead>
                        <tbody>
                            <tr th:each="staff : ${staffList}">
                                <td th:text="${staff.maNV}">NV01</td>
                                <td th:text="${staff.hoTen}">Họ tên</td>
                                <td th:text="${staff.chucVu}">Chức vụ</td>
                                <td th:text="${staff.sdt != null ? staff.sdt : '—'}">—</td>
                                <td th:text="${staff.ngayVaoLam != null ? #temporals.format(staff.ngayVaoLam, 'dd/MM/yyyy') : '—'}">—</td>
                                <td style="text-align:right" th:text="${staff.luong != null ? #numbers.formatDecimal(staff.luong, 0, 'COMMA', 0, 'POINT') + ' đ' : '—'}">—</td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(staffList)}"><td colspan="6">Chưa có nhân viên. Thêm nhân viên để xác nhận đặt bàn.</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>
</div>
</body>
</html>
