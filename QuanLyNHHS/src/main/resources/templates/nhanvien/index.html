<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Nhân Viên - Hải Sản Hoàng Gia</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/danh-muc.css}">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar Fragment -->
        <div th:replace="~{layout/sidebar :: sidebar}"></div>

        <!-- Main Wrapper -->
        <main class="main-wrapper">
            <!-- Navbar Fragment -->
            <div th:replace="~{layout/navbar :: navbar('Nhân viên', 'fa-solid fa-user-group')}"></div>

            <div class="content-body">
                <p class="module-message success" role="status" th:if="${successMessage}" th:text="${successMessage}"></p>
                <p class="module-message error" role="alert" th:if="${errorMessage}" th:text="${errorMessage}"></p>
                <!-- Metrics Row -->
                <div class="metrics-grid">
                    <div class="metric-card cyan">
                        <div class="metric-icon cyan">
                            <i class="fa-solid fa-users"></i>
                        </div>
                        <div class="metric-info">
                            <h3 th:text="${totalStaff}"></h3>
                            <p>Tổng số lượng nhân sự</p>
                        </div>
                    </div>

                    <div class="metric-card emerald">
                        <div class="metric-icon emerald">
                            <i class="fa-solid fa-user-check"></i>
                        </div>
                        <div class="metric-info">
                            <h3 th:text="${activeStaff}"></h3>
                            <p>Nhân viên đang làm việc</p>
                        </div>
                    </div>

                    <div class="metric-card gold">
                        <div class="metric-icon gold">
                            <i class="fa-solid fa-calendar-xmark"></i>
                        </div>
                        <div class="metric-info">
                            <h3 th:text="${onLeaveStaff}"></h3>
                            <p>Nhân viên nghỉ phép</p>
                        </div>
                    </div>
                </div>

                <!-- Toolbar & Actions -->
                <div class="toolbar-section">
                    <div class="toolbar-left">
                        <div class="search-box">
                            <i class="fa-solid fa-magnifying-glass"></i>
                            <input type="text" id="searchStaffInput" placeholder="Tìm tên nhân viên, mã NV, số ĐT...">
                        </div>

                        <!-- Department Filter Pills -->
                        <div class="filter-pills">
                            <button class="pill-btn active" data-role="all">Tất cả</button>
                            <button class="pill-btn" data-role="Quản lý nhà hàng">Quản Lý</button>
                            <button class="pill-btn" data-role="Bếp">Bếp & Đầu Bếp</button>
                            <button class="pill-btn" data-role="Thu ngân">Thu Ngân</button>
                            <button class="pill-btn" data-role="Nhân viên phục vụ">Phục Vụ</button>
                            <button class="pill-btn" data-role="Lễ tân & Chăm sóc khách hàng">Lễ Tân</button>
                        </div>
                    </div>

                    <div class="toolbar-right">
                        <a class="btn-primary" th:href="@{/nhan-vien/them}">
                            <i class="fa-solid fa-user-plus"></i>
                            <span>Thêm nhân viên</span>
                        </a>
                    </div>
                </div>

                <!-- Staff Table -->
                <div class="table-responsive">
                    <table class="custom-table">
                        <thead>
                            <tr>
                                <th>Mã NV</th>
                                <th>Họ Và Tên</th>
                                <th>Liên Hệ</th>
                                <th>Chức Vụ</th>
                                <th>Ca Làm Việc</th>
                                <th>Ngày Vào Làm</th>
                                <th>Mức Lương</th>
                                <th>Trạng Thái</th>
                                <th style="text-align: right;">Thao Tác</th>
                            </tr>
                        </thead>
                        <tbody id="staffTableBody">
                            <tr th:each="staff : ${staffList}"
                                th:data-role="${#strings.contains(staff.chucVu ?: '', 'Bếp') || #strings.contains(staff.chucVu ?: '', 'Đầu bếp')} ? 'Bếp' : (${#strings.contains(staff.chucVu ?: '', 'Thu ngân')} ? 'Thu ngân' : ${staff.chucVu ?: 'Khác'})">
                                <td style="font-weight: 700; color: var(--cyan-primary);" th:text="${staff.maNV}"></td>
                                <td>
                                    <div style="display: flex; align-items: center; gap: 12px;">
                                        <div class="staff-avatar-circle" th:text="${#strings.isEmpty(staff.hoTen) ? '?' : #strings.substring(staff.hoTen, 0, 1)}"></div>
                                        <div>
                                            <div style="font-weight: 600; color: var(--text-main);" th:text="${staff.hoTen}"></div>
                                            <div style="font-size: 11.5px; color: var(--text-dim);" th:text="${staff.email ?: 'Chưa cập nhật'}"></div>
                                        </div>
                                    </div>
                                </td>
                                <td>
                                    <div style="font-size: 13px; color: var(--text-main);">
                                        <i class="fa-solid fa-phone" style="font-size: 11px; color: var(--text-dim); margin-right: 4px;"></i>
                                        <span th:text="${staff.soDienThoai}"></span>
                                    </div>
                                </td>
                                <td>
                                    <!-- Dynamic Badge for Role -->
                                    <span class="badge-role"
                                          th:classappend="${#strings.contains(staff.chucVu ?: '', 'Quản lý')} ? 'manager' : (${#strings.contains(staff.chucVu ?: '', 'Bếp') || #strings.contains(staff.chucVu ?: '', 'Đầu bếp')} ? 'chef' : (${#strings.contains(staff.chucVu ?: '', 'Thu ngân')} ? 'cashier' : (${#strings.contains(staff.chucVu ?: '', 'Phục vụ')} ? 'service' : 'reception')))"
                                          th:text="${staff.chucVu}"></span>
                                </td>
                                <td>
                                    <span style="font-size: 12.5px; color: var(--text-muted);" th:text="${staff.caLamViec ?: 'Chưa cập nhật'}"></span>
                                </td>
                                <td style="color: var(--text-dim); font-size: 12.5px;" th:text="${staff.ngayVaoLam}"></td>
                                <td style="font-weight: 700; color: var(--gold-accent);"
                                    th:text="${staff.luong != null ? #numbers.formatDecimal(staff.luong, 0, 'COMMA', 0, 'POINT') + ' đ' : 'Chưa cập nhật'}"></td>
                                <td>
                                    <span class="dish-badge-status"
                                          th:classappend="${staff.trangThai == 'Đang làm việc'} ? 'badge-serving' : 'badge-out'"
                                          th:text="${staff.trangThai ?: 'Chưa cập nhật'}" style="position: static;"></span>
                                </td>
                                <td style="text-align: right;">
                                    <div style="display: inline-flex; gap: 8px;">
                                        <a class="btn-action edit" title="Sửa" th:href="@{/nhan-vien/sua/{id}(id=${staff.maNv})}" aria-label="Sửa nhân viên">
                                            <i class="fa-solid fa-user-pen"></i>
                                        </a>
                                        <form class="inline-delete" th:action="@{/nhan-vien/xoa/{id}(id=${staff.maNv})}" method="post" onsubmit="return confirm('Bạn có chắc muốn xóa bản ghi này?');">
                                            <button class="btn-action delete" type="submit" title="Xóa" aria-label="Xóa nhân viên"><i class="fa-solid fa-trash-can"></i></button>
                                        </form>
                                    </div>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(staffList)}"><td colspan="9">Chưa có nhân viên.</td></tr>
                        </tbody>
                    </table>
                </div>

            </div>
        </main>
    </div>

    <!-- Dùng chung biểu mẫu thêm/sửa; lỗi kiểm tra giữ lại dữ liệu vừa nhập. -->
    <div class="modal-overlay active" th:if="${showForm == true}">
        <section class="modal-box" role="dialog" aria-modal="true" aria-labelledby="edit-title">
            <div class="modal-header">
                <h3 id="edit-title" th:text="${editingId == null ? 'Thêm nhân viên' : 'Sửa nhân viên'}"></h3>
                <a class="modal-close" th:href="@{/nhan-vien}" aria-label="Đóng"><i class="fa-solid fa-xmark"></i></a>
            </div>
            <form th:action="@{${formAction}}" th:object="${form}" method="post">
                <div class="modal-body">
                    <div class="module-message error" role="alert" th:if="${#fields.hasGlobalErrors()}">
                        <p th:each="error : ${#fields.globalErrors()}" th:text="${error}"></p>
                    </div>
                    <p th:if="${editingId != null}">Mã: <strong th:text="${editingId}"></strong></p>
                    <div class="form-group">
                        <label for="hoTen">Họ và tên</label>
                        <input type="text" id="hoTen" th:field="*{hoTen}" required maxlength="100" th:attr="aria-invalid=${#fields.hasErrors('hoTen')}">
                        <small class="field-error" th:if="${#fields.hasErrors('hoTen')}" th:errors="*{hoTen}"></small>
                    </div>
                    <div class="form-group">
                        <label for="gioiTinh">Giới tính</label>
                        <select id="gioiTinh" th:field="*{gioiTinh}"  th:attr="aria-invalid=${#fields.hasErrors('gioiTinh')}"><option value="">Chưa cập nhật</option><option value="Nam">Nam</option><option value="Nữ">Nữ</option><option value="Khác">Khác</option></select>
                        <small class="field-error" th:if="${#fields.hasErrors('gioiTinh')}" th:errors="*{gioiTinh}"></small>
                    </div>
                    <div class="form-group">
                        <label for="sdt">Số điện thoại</label>
                        <input type="tel" id="sdt" th:field="*{sdt}" maxlength="15" th:attr="aria-invalid=${#fields.hasErrors('sdt')}">
                        <small class="field-error" th:if="${#fields.hasErrors('sdt')}" th:errors="*{sdt}"></small>
                    </div>
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" th:field="*{email}" maxlength="100" th:attr="aria-invalid=${#fields.hasErrors('email')}">
                        <small class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></small>
                    </div>
                    <div class="form-group">
                        <label for="chucVu">Chức vụ</label>
                        <input type="text" id="chucVu" th:field="*{chucVu}" required maxlength="50" list="staffPositions" th:attr="aria-invalid=${#fields.hasErrors('chucVu')}">
                        <small class="field-error" th:if="${#fields.hasErrors('chucVu')}" th:errors="*{chucVu}"></small>
                    </div>
                    <div class="form-group">
                        <label for="caLamViec">Ca làm việc</label>
                        <input type="text" id="caLamViec" th:field="*{caLamViec}" maxlength="100" list="staffShifts" th:attr="aria-invalid=${#fields.hasErrors('caLamViec')}">
                        <small class="field-error" th:if="${#fields.hasErrors('caLamViec')}" th:errors="*{caLamViec}"></small>
                    </div>
                    <div class="form-group">
                        <label for="luong">Lương (VNĐ)</label>
                        <input type="number" id="luong" th:field="*{luong}" min="0" max="9999999999.99" step="0.01" th:attr="aria-invalid=${#fields.hasErrors('luong')}">
                        <small class="field-error" th:if="${#fields.hasErrors('luong')}" th:errors="*{luong}"></small>
                    </div>
                    <div class="form-group">
                        <label for="ngayVaoLam">Ngày vào làm</label>
                        <input type="date" id="ngayVaoLam" th:field="*{ngayVaoLam}"  th:attr="aria-invalid=${#fields.hasErrors('ngayVaoLam')}">
                        <small class="field-error" th:if="${#fields.hasErrors('ngayVaoLam')}" th:errors="*{ngayVaoLam}"></small>
                    </div>
                    <div class="form-group">
                        <label for="trangThai">Trạng thái</label>
                        <select id="trangThai" th:field="*{trangThai}" required th:attr="aria-invalid=${#fields.hasErrors('trangThai')}"><option value="Đang làm việc">Đang làm việc</option><option value="Nghỉ phép">Nghỉ phép</option><option value="Đã nghỉ việc">Đã nghỉ việc</option></select>
                        <small class="field-error" th:if="${#fields.hasErrors('trangThai')}" th:errors="*{trangThai}"></small>
                    </div>
                    <datalist id="staffPositions"><option value="Quản lý nhà hàng"></option><option value="Bếp trưởng"></option><option value="Đầu bếp"></option><option value="Thu ngân"></option><option value="Nhân viên phục vụ"></option><option value="Lễ tân &amp; Chăm sóc khách hàng"></option></datalist>
                    <datalist id="staffShifts"><option value="Toàn thời gian"></option><option value="Ca sáng (07:30 - 15:30)"></option><option value="Ca tối (15:00 - 23:00)"></option></datalist>
                </div>
                <div class="modal-footer">
                    <a class="btn-secondary" th:href="@{/nhan-vien}">Hủy</a>
                    <button type="submit" class="btn-primary"><i class="fa-solid fa-check"></i><span>Lưu nhân viên</span></button>
                </div>
            </form>
        </section>
    </div>

    <!-- Scripts -->
    <script th:src="@{/js/main.js}"></script>
</body>
</html>
