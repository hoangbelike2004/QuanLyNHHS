<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle} + ' - Nhà hàng Hải Sản'">Form Khách hàng</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .navbar-brand { font-weight: 700; color: #0d6efd !important; }
        .form-label { font-weight: 500; }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
    <div class="container">
        <a class="navbar-brand" href="/"><i class="bi bi-fish"></i> Nhà hàng Hải Sản</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link active fw-semibold" href="/khach-hang"><i class="bi bi-people"></i> Khách hàng</a></li>
                <li class="nav-item"><a class="nav-link" href="/ban-an"><i class="bi bi-grid"></i> Bàn ăn</a></li>
                <li class="nav-item"><a class="nav-link" href="/dat-ban"><i class="bi bi-calendar-check"></i> Đặt bàn</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <nav aria-label="breadcrumb" class="mb-3">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a href="/khach-hang">Khách hàng</a></li>
            <li class="breadcrumb-item active" th:text="${pageTitle}"></li>
        </ol>
    </nav>

    <div class="row justify-content-center">
        <div class="col-md-7">
            <div class="card shadow-sm">
                <div class="card-header bg-primary text-white">
                    <h5 class="mb-0"><i class="bi bi-person-lines-fill me-2"></i><span th:text="${pageTitle}">Form KH</span></h5>
                </div>
                <div class="card-body">
                    <div th:if="${errorMessage}" class="alert alert-danger">
                        <i class="bi bi-exclamation-triangle-fill me-1"></i><span th:text="${errorMessage}"></span>
                    </div>

                    <form th:object="${khachHang}"
                          th:action="${isEdit} ? @{/khach-hang/sua/{id}(id=${khachHang.maKh})} : @{/khach-hang/them}"
                          method="post" novalidate class="needs-validation">

                        <!-- Họ tên -->
                        <div class="mb-3">
                            <label class="form-label" for="hoTen">Họ và tên <span class="text-danger">*</span></label>
                            <input type="text" id="hoTen" class="form-control"
                                   th:field="*{hoTen}"
                                   placeholder="Nhập họ và tên khách hàng"
                                   required maxlength="100">
                        </div>

                        <!-- Số điện thoại -->
                        <div class="mb-3">
                            <label class="form-label" for="sdt">Số điện thoại</label>
                            <input type="tel" id="sdt" class="form-control"
                                   th:field="*{sdt}"
                                   placeholder="Ví dụ: 0901234567"
                                   maxlength="15" pattern="[0-9]{10,15}">
                        </div>

                        <!-- Email -->
                        <div class="mb-3">
                            <label class="form-label" for="email">Email</label>
                            <input type="email" id="email" class="form-control"
                                   th:field="*{email}"
                                   placeholder="Ví dụ: khachhang@email.com"
                                   maxlength="100">
                        </div>

                        <!-- Điểm tích lũy -->
                        <div class="mb-3">
                            <label class="form-label" for="diemTichLuy">Điểm tích lũy</label>
                            <input type="number" id="diemTichLuy" class="form-control"
                                   th:field="*{diemTichLuy}" min="0" value="0">
                        </div>

                        <div class="d-flex gap-2 justify-content-end">
                            <a href="/khach-hang" class="btn btn-outline-secondary"><i class="bi bi-arrow-left me-1"></i> Quay lại</a>
                            <button type="submit" class="btn btn-primary">
                                <i class="bi bi-save me-1"></i>
                                <span th:text="${isEdit} ? 'Cập nhật' : 'Thêm mới'">Lưu</span>
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
