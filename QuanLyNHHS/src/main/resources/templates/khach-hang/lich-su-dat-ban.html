<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle} + ' - Nhà hàng Hải Sản'">Lịch sử đặt bàn</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .navbar-brand { font-weight: 700; color: #0d6efd !important; }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
    <div class="container">
        <a class="navbar-brand" href="/"><i class="bi bi-fish"></i> Nhà hàng Hải Sản</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link active fw-semibold" href="/khach-hang"><i class="bi bi-people"></i> Khách hàng</a></li>
                <li class="nav-item"><a class="nav-link" href="/ban-an"><i class="bi bi-grid"></i> Bàn ăn</a></li>
                <li class="nav-item"><a class="nav-link" href="/dat-ban"><i class="bi bi-calendar-check"></i> Đặt bàn</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <nav aria-label="breadcrumb" class="mb-3">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a href="/khach-hang">Khách hàng</a></li>
            <li class="breadcrumb-item active">Lịch sử đặt bàn</li>
        </ol>
    </nav>

    <!-- Thông tin khách hàng -->
    <div class="card mb-4 shadow-sm border-primary">
        <div class="card-header bg-primary text-white">
            <h5 class="mb-0"><i class="bi bi-person-badge me-2"></i>Thông tin khách hàng</h5>
        </div>
        <div class="card-body">
            <div class="row g-3">
                <div class="col-md-3"><strong>Mã KH:</strong><br>
                    <span class="badge bg-secondary fs-6" th:text="${khachHang.maKh}"></span>
                </div>
                <div class="col-md-3"><strong>Tên:</strong><br>
                    <span th:text="${khachHang.hoTen}" class="fs-5"></span>
                </div>
                <div class="col-md-2"><strong>SĐT:</strong><br>
                    <span th:text="${khachHang.sdt}"></span>
                </div>
                <div class="col-md-2"><strong>Điểm tích lũy:</strong><br>
                    <span class="badge bg-info text-dark fs-6" th:text="${khachHang.diemTichLuy}"></span>
                </div>
                <div class="col-md-2"><strong>Email:</strong><br>
                    <span th:text="${khachHang.email}"></span>
                </div>
            </div>
        </div>
    </div>

    <!-- Lịch sử đặt bàn -->
    <div class="card shadow-sm">
        <div class="card-header d-flex justify-content-between align-items-center">
            <h5 class="mb-0"><i class="bi bi-clock-history me-2"></i>Lịch sử đặt bàn</h5>
            <span class="badge bg-primary" th:text="${#lists.size(danhSachDatBan)} + ' lần'"></span>
        </div>
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover mb-0">
                    <thead class="table-light">
                    <tr>
                        <th>#</th>
                        <th>Mã đặt bàn</th>
                        <th>Bàn</th>
                        <th>Ngày đặt</th>
                        <th class="text-center">Số người</th>
                        <th class="text-end">Tiền cọc</th>
                        <th class="text-center">Trạng thái</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:if="${#lists.isEmpty(danhSachDatBan)}">
                        <td colspan="7" class="text-center py-4 text-muted">
                            <i class="bi bi-inbox fs-4 d-block mb-2"></i> Chưa có lịch sử đặt bàn.
                        </td>
                    </tr>
                    <tr th:each="db, stat : ${danhSachDatBan}">
                        <td th:text="${stat.index + 1}"></td>
                        <td><code th:text="${db.maDat}"></code></td>
                        <td th:text="${db.banAn != null ? db.banAn.tenBan : '—'}"></td>
                        <td th:text="${db.ngayDat != null ? #temporals.format(db.ngayDat, 'dd/MM/yyyy') : '—'}"></td>
                        <td class="text-center" th:text="${db.soNguoi}"></td>
                        <td class="text-end">
                            <span th:if="${db.tienCoc != null}" th:text="${#numbers.formatDecimal(db.tienCoc, 0, 'COMMA', 0, 'POINT')} + ' đ'"></span>
                            <span th:unless="${db.tienCoc != null}" class="text-muted">—</span>
                        </td>
                        <td class="text-center">
                            <span class="badge"
                                  th:classappend="${db.trangThai == 'CHO_XAC_NHAN'} ? 'bg-warning text-dark' :
                                                  (${db.trangThai == 'DA_XAC_NHAN'} ? 'bg-success' :
                                                  (${db.trangThai == 'DA_HUY'} ? 'bg-danger' : 'bg-secondary'))"
                                  th:text="${db.trangThai == 'CHO_XAC_NHAN'} ? 'Chờ xác nhận' :
                                           (${db.trangThai == 'DA_XAC_NHAN'} ? 'Đã xác nhận' :
                                           (${db.trangThai == 'DA_HUY'} ? 'Đã hủy' :
                                           (${db.trangThai == 'HOAN_THANH'} ? 'Hoàn thành' : ${db.trangThai})))"></span>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <div class="mt-3">
        <a href="/khach-hang" class="btn btn-outline-secondary">
            <i class="bi bi-arrow-left me-1"></i> Quay lại danh sách
        </a>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
