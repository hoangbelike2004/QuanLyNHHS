<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle} + ' - Nhà hàng Hải Sản'">Lịch sử đặt bàn</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/reservation.css}">
</head>
<body>
<div class="app-container" th:with="activeMenu='khachhang'">
    <div th:replace="~{layout/sidebar :: sidebar}"></div>
    <main class="main-wrapper">
        <div th:replace="~{layout/navbar :: navbar('Khách hàng', 'fa-solid fa-users')}"></div>
        <div class="content-body reservation-module">
            <nav class="reservation-nav" aria-label="Khách hàng và đặt bàn">
                <a th:href="@{/}"><i class="fa-solid fa-house"></i> Trang chủ</a>
                <a th:href="@{/khach-hang}" th:classappend="${activeMenu == 'khachhang'} ? 'selected' : ''">Khách hàng</a>
                <a th:href="@{/ban-an}" th:classappend="${activeMenu == 'banan'} ? 'selected' : ''">Bàn ăn</a>
                <a th:href="@{/dat-ban}" th:classappend="${activeMenu == 'datban'} ? 'selected' : ''">Đặt bàn</a>
            </nav>


<div class="container mt-4">
    <nav aria-label="breadcrumb" class="mb-3">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a href="/khach-hang">Khách hàng</a></li>
            <li class="breadcrumb-item active">Lịch sử đặt bàn</li>
        </ol>
    </nav>

    <!-- Thông tin khách hàng -->
    <div class="card mb-4 shadow-sm border-primary">
        <div class="card-header bg-primary text-white">
            <h5 class="mb-0"><i class="fa-solid fa-id-badge me-2"></i>Thông tin khách hàng</h5>
        </div>
        <div class="card-body">
            <div class="row g-3">
                <div class="col-md-3"><strong>Mã KH:</strong><br>
                    <span class="badge bg-secondary fs-6" th:text="${khachHang.maKh}"></span>
                </div>
                <div class="col-md-3"><strong>Tên:</strong><br>
                    <span th:text="${khachHang.hoTen}" class="fs-5"></span>
                </div>
                <div class="col-md-2"><strong>SĐT:</strong><br>
                    <span th:text="${khachHang.sdt}"></span>
                </div>
                <div class="col-md-2"><strong>Điểm tích lũy:</strong><br>
                    <span class="badge bg-info text-dark fs-6" th:text="${khachHang.diemTichLuy}"></span>
                </div>
                <div class="col-md-2"><strong>Email:</strong><br>
                    <span th:text="${khachHang.email}"></span>
                </div>
            </div>
        </div>
    </div>

    <!-- Lịch sử đặt bàn -->
    <div class="card shadow-sm">
        <div class="card-header d-flex justify-content-between align-items-center">
            <h5 class="mb-0"><i class="fa-solid fa-clock-rotate-left me-2"></i>Lịch sử đặt bàn</h5>
            <span class="badge bg-primary" th:text="${#lists.size(danhSachDatBan)} + ' lần'"></span>
        </div>
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover mb-0">
                    <thead class="table-light">
                    <tr>
                        <th>#</th>
                        <th>Mã đặt bàn</th>
                        <th>Bàn</th>
                        <th>Ngày đặt</th>
                        <th class="text-center">Số người</th>
                        <th class="text-end">Tiền cọc</th>
                        <th class="text-center">Trạng thái</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:if="${#lists.isEmpty(danhSachDatBan)}">
                        <td colspan="7" class="text-center py-4 text-muted">
                            <i class="fa-solid fa-inbox fs-4 d-block mb-2"></i> Chưa có lịch sử đặt bàn.
                        </td>
                    </tr>
                    <tr th:each="db, stat : ${danhSachDatBan}">
                        <td th:text="${stat.index + 1}"></td>
                        <td><code th:text="${db.maDat}"></code></td>
                        <td th:text="${db.banAn != null ? db.banAn.tenBan : '—'}"></td>
                        <td th:text="${db.ngayDat != null ? #temporals.format(db.ngayDat, 'dd/MM/yyyy') : '—'}"></td>
                        <td class="text-center" th:text="${db.soNguoi}"></td>
                        <td class="text-end">
                            <span th:if="${db.tienCoc != null}" th:text="${#numbers.formatDecimal(db.tienCoc, 0, 'COMMA', 0, 'POINT')} + ' đ'"></span>
                            <span th:unless="${db.tienCoc != null}" class="text-muted">—</span>
                        </td>
                        <td class="text-center">
                            <span class="badge"
                                  th:classappend="${db.trangThai == 'CHO_XAC_NHAN'} ? 'bg-warning text-dark' :
                                                  (${db.trangThai == 'DA_XAC_NHAN'} ? 'bg-success' :
                                                  (${db.trangThai == 'DA_HUY'} ? 'bg-danger' : 'bg-secondary'))"
                                  th:text="${db.trangThai == 'CHO_XAC_NHAN'} ? 'Chờ xác nhận' :
                                           (${db.trangThai == 'DA_XAC_NHAN'} ? 'Đã xác nhận' :
                                           (${db.trangThai == 'DA_HUY'} ? 'Đã hủy' :
                                           (${db.trangThai == 'HOAN_THANH'} ? 'Hoàn thành' : ${db.trangThai})))"></span>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <div class="mt-3">
        <a href="/khach-hang" class="btn btn-outline-secondary">
            <i class="fa-solid fa-arrow-left me-1"></i> Quay lại danh sách
        </a>
    </div>
</div>
        </div>
    </main>
</div>
<script th:src="@{/js/reservation.js}" defer></script>
</body>
</html>
