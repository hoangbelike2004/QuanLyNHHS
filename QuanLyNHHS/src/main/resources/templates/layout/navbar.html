<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
    <header class="top-navbar" th:fragment="navbar(pageTitle, pageIcon)">
        <div class="navbar-left">
            <button class="menu-toggle" type="button" aria-label="Mở menu" aria-controls="app-sidebar" aria-expanded="false"><i class="fa-solid fa-bars" aria-hidden="true"></i></button>
            <div class="page-title"><span th:text="${pageTitle}">Quản lý nhà hàng</span></div>
        </div>
        <div class="navbar-right">
            <span class="navbar-caption">Hải sản Hoàng Gia</span>
            <form th:action="@{/logout}" method="post"><button type="submit">Đăng xuất</button></form>
        </div>
        <script th:src="@{/js/app-shell.js}" defer></script>
    </header>
</body>
</html>
