<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle} + ' - Nhà hàng Hải Sản'">Form Đặt bàn</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .navbar-brand { font-weight: 700; color: #0d6efd !important; }
        .form-label { font-weight: 500; }
        .section-divider { border-top: 1px solid #dee2e6; margin: 1.2rem 0; }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
    <div class="container">
        <a class="navbar-brand" href="/"><i class="bi bi-fish"></i> Nhà hàng Hải Sản</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="/khach-hang"><i class="bi bi-people"></i> Khách hàng</a></li>
                <li class="nav-item"><a class="nav-link" href="/ban-an"><i class="bi bi-grid"></i> Bàn ăn</a></li>
                <li class="nav-item"><a class="nav-link active fw-semibold" href="/dat-ban"><i class="bi bi-calendar-check"></i> Đặt bàn</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <nav aria-label="breadcrumb" class="mb-3">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a href="/dat-ban">Đặt bàn</a></li>
            <li class="breadcrumb-item active" th:text="${pageTitle}"></li>
        </ol>
    </nav>

    <div class="row justify-content-center">
        <div class="col-md-9">
            <div class="card shadow-sm">
                <div class="card-header bg-primary text-white">
                    <h5 class="mb-0">
                        <i class="bi bi-calendar-plus me-2"></i>
                        <span th:text="${pageTitle}">Form Đặt bàn</span>
                    </h5>
                </div>
                <div class="card-body">
                    <div th:if="${errorMessage}" class="alert alert-danger">
                        <i class="bi bi-exclamation-triangle-fill me-1"></i><span th:text="${errorMessage}"></span>
                    </div>

                    <!-- Cảnh báo khi không có bàn trống (chỉ hiển thị khi thêm mới) -->
                    <div th:if="${!isEdit and #lists.isEmpty(danhSachBan)}" class="alert alert-warning">
                        <i class="bi bi-exclamation-triangle-fill me-1"></i>
                        Hiện không có bàn nào trống. Vui lòng cập nhật trạng thái bàn trước.
                        <a href="/ban-an" class="alert-link ms-2">Quản lý bàn ăn</a>
                    </div>

                    <!--
                        Form thêm mới: POST /dat-ban/them với tất cả params
                        Form sửa: POST /dat-ban/sua/{maDat}
                    -->
                    <form th:action="${isEdit} ? @{/dat-ban/sua/{id}(id=${datBan.maDat})} : @{/dat-ban/them}"
                          method="post" class="needs-validation" novalidate>

                        <div class="row g-3">
                            <!-- Số người -->
                            <div class="col-md-4">
                                <label class="form-label" for="soNguoi">Số người <span class="text-danger">*</span></label>
                                <input type="number" id="soNguoi" name="soNguoi" class="form-control"
                                       th:value="${datBan.soNguoi}"
                                       min="1" max="100"
                                       placeholder="Số người đến"
                                       required>
                            </div>

                            <!-- Ngày đặt -->
                            <div class="col-md-4">
                                <label class="form-label" for="ngayDat">Ngày đặt <span class="text-danger">*</span></label>
                                <input type="date" id="ngayDat" name="ngayDat" class="form-control"
                                       th:value="${datBan.ngayDat != null ? #temporals.format(datBan.ngayDat, 'yyyy-MM-dd') : ''}"
                                       required>
                            </div>

                            <!-- Tiền cọc -->
                            <div class="col-md-4">
                                <label class="form-label" for="tienCoc">Tiền cọc (đ)</label>
                                <input type="number" id="tienCoc" name="tienCoc" class="form-control"
                                       th:value="${datBan.tienCoc}"
                                       min="0" step="1000"
                                       placeholder="0">
                            </div>

                            <!-- Trạng thái (chỉ hiện khi sửa) -->
                            <div class="col-md-4" th:if="${isEdit}">
                                <label class="form-label" for="trangThai">Trạng thái</label>
                                <select id="trangThai" name="trangThai" class="form-select">
                                    <option value="CHO_XAC_NHAN" th:selected="${datBan.trangThai == 'CHO_XAC_NHAN'}">⏳ Chờ xác nhận</option>
                                    <option value="DA_XAC_NHAN" th:selected="${datBan.trangThai == 'DA_XAC_NHAN'}">✔ Đã xác nhận</option>
                                    <option value="DA_HUY" th:selected="${datBan.trangThai == 'DA_HUY'}">✖ Đã hủy</option>
                                    <option value="HOAN_THANH" th:selected="${datBan.trangThai == 'HOAN_THANH'}">🏁 Hoàn thành</option>
                                </select>
                            </div>
                        </div>

                        <div class="section-divider"></div>

                        <div class="row g-3">
                            <!-- Khách hàng -->
                            <div class="col-md-6">
                                <label class="form-label" for="maKh">Khách hàng <span class="text-danger">*</span></label>
                                <select id="maKh" name="maKh" class="form-select" required>
                                    <option value="">-- Chọn khách hàng --</option>
                                    <option th:each="kh : ${danhSachKhachHang}"
                                            th:value="${kh.maKh}"
                                            th:selected="${datBan.khachHang != null and datBan.khachHang.maKh == kh.maKh}"
                                            th:text="${kh.hoTen} + ' (' + ${kh.sdt} + ')'">
                                    </option>
                                </select>
                            </div>

                            <!-- Bàn -->
                            <div class="col-md-6">
                                <label class="form-label" for="maBan">
                                    Bàn ăn <span class="text-danger">*</span>
                                </label>
                                <select id="maBan" name="maBan" class="form-select" required>
                                    <option value="">-- Chọn bàn --</option>
                                    <option th:each="ban : ${danhSachBan}"
                                            th:value="${ban.maBan}"
                                            th:selected="${datBan.banAn != null and datBan.banAn.maBan == ban.maBan}"
                                            th:text="${ban.tenBan} + ' - ' + ${ban.khuVuc} + ' (' + ${ban.soCho} + ' chỗ) [' + ${ban.trangThai} + ']'">
                                    </option>
                                </select>
                            </div>
                        </div>

                        <div class="section-divider"></div>

                        <!-- Nút hành động -->
                        <div class="d-flex gap-2 justify-content-end">
                            <a href="/dat-ban" class="btn btn-outline-secondary">
                                <i class="bi bi-arrow-left me-1"></i> Quay lại
                            </a>
                            <button type="submit" class="btn btn-primary">
                                <i class="bi bi-save me-1"></i>
                                <span th:text="${isEdit} ? 'Cập nhật' : 'Xác nhận đặt bàn'">Lưu</span>
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    (function () {
        'use strict';
        const forms = document.querySelectorAll('.needs-validation');
        Array.from(forms).forEach(function (form) {
            form.addEventListener('submit', function (event) {
                if (!form.checkValidity()) {
                    event.preventDefault();
                    event.stopPropagation();
                }
                form.classList.add('was-validated');
            }, false);
        });
    })();
</script>
</body>
</html>
