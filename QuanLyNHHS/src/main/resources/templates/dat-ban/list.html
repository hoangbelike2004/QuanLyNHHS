<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle} + ' - Nhà hàng Hải Sản'">Đặt bàn</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .navbar-brand { font-weight: 700; color: #0d6efd !important; }
        .page-header { border-bottom: 2px solid #0d6efd; padding-bottom: 10px; margin-bottom: 20px; }
        .table-hover tbody tr:hover { background-color: #e8f4fd; }
        .action-btns form { display: inline; }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
    <div class="container">
        <a class="navbar-brand" href="/"><i class="bi bi-fish"></i> Nhà hàng Hải Sản</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navMenu">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="/khach-hang"><i class="bi bi-people"></i> Khách hàng</a></li>
                <li class="nav-item"><a class="nav-link" href="/ban-an"><i class="bi bi-grid"></i> Bàn ăn</a></li>
                <li class="nav-item"><a class="nav-link active fw-semibold" href="/dat-ban"><i class="bi bi-calendar-check"></i> Đặt bàn</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="container-fluid mt-4 px-4">
    <div class="page-header d-flex justify-content-between align-items-center">
        <h3 class="text-primary mb-0"><i class="bi bi-calendar-check-fill me-2"></i>Danh sách Đặt bàn</h3>
        <a href="/dat-ban/them" class="btn btn-primary">
            <i class="bi bi-plus-circle me-1"></i> Đặt bàn mới
        </a>
    </div>

    <!-- Thông báo -->
    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show">
        <i class="bi bi-check-circle-fill me-1"></i><span th:text="${successMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show">
        <i class="bi bi-exclamation-triangle-fill me-1"></i><span th:text="${errorMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <!-- Lọc trạng thái -->
    <div class="card mb-3 shadow-sm">
        <div class="card-body py-2">
            <div class="d-flex gap-2 flex-wrap align-items-center">
                <span class="fw-semibold me-1">Lọc:</span>
                <a href="/dat-ban" class="btn btn-sm"
                   th:classappend="${trangThaiFilter == null} ? 'btn-primary' : 'btn-outline-secondary'">Tất cả</a>
                <a href="/dat-ban?trangThai=CHO_XAC_NHAN" class="btn btn-sm"
                   th:classappend="${trangThaiFilter == 'CHO_XAC_NHAN'} ? 'btn-warning' : 'btn-outline-warning'">⏳ Chờ xác nhận</a>
                <a href="/dat-ban?trangThai=DA_XAC_NHAN" class="btn btn-sm"
                   th:classappend="${trangThaiFilter == 'DA_XAC_NHAN'} ? 'btn-success' : 'btn-outline-success'">✔ Đã xác nhận</a>
                <a href="/dat-ban?trangThai=DA_HUY" class="btn btn-sm"
                   th:classappend="${trangThaiFilter == 'DA_HUY'} ? 'btn-danger' : 'btn-outline-danger'">✖ Đã hủy</a>
                <a href="/dat-ban?trangThai=HOAN_THANH" class="btn btn-sm"
                   th:classappend="${trangThaiFilter == 'HOAN_THANH'} ? 'btn-secondary' : 'btn-outline-secondary'">🏁 Hoàn thành</a>
            </div>
        </div>
    </div>

    <!-- Bảng danh sách -->
    <div class="card shadow-sm">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover table-striped mb-0">
                    <thead class="table-primary">
                    <tr>
                        <th>#</th>
                        <th>Mã đặt bàn</th>
                        <th>Khách hàng</th>
                        <th>Bàn</th>
                        <th>Ngày đặt</th>
                        <th class="text-center">Số người</th>
                        <th class="text-end">Tiền cọc</th>
                        <th class="text-center">Trạng thái</th>
                        <th class="text-center">Hành động</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:if="${#lists.isEmpty(danhSachDatBan)}">
                        <td colspan="9" class="text-center py-4 text-muted">
                            <i class="bi bi-inbox fs-4 d-block mb-2"></i> Chưa có đặt bàn nào.
                        </td>
                    </tr>
                    <tr th:each="db, stat : ${danhSachDatBan}">
                        <td th:text="${stat.index + 1}"></td>
                        <td><code th:text="${db.maDat}"></code></td>
                        <td>
                            <span th:if="${db.khachHang != null}">
                                <a th:href="@{/khach-hang/{id}/lich-su-dat-ban(id=${db.khachHang.maKh})}"
                                   th:text="${db.khachHang.hoTen}" class="text-decoration-none fw-semibold"></a>
                                <br><small class="text-muted" th:text="${db.khachHang.sdt}"></small>
                            </span>
                            <span th:unless="${db.khachHang != null}" class="text-muted">—</span>
                        </td>
                        <td>
                            <span th:if="${db.banAn != null}">
                                <strong th:text="${db.banAn.tenBan}"></strong>
                                <br><small class="text-muted" th:text="${db.banAn.khuVuc}"></small>
                            </span>
                            <span th:unless="${db.banAn != null}" class="text-muted">—</span>
                        </td>
                        <td th:text="${db.ngayDat != null ? #temporals.format(db.ngayDat, 'dd/MM/yyyy') : '—'}"></td>
                        <td class="text-center" th:text="${db.soNguoi}"></td>
                        <td class="text-end">
                            <span th:if="${db.tienCoc != null}" th:text="${#numbers.formatDecimal(db.tienCoc, 0, 'COMMA', 0, 'POINT')} + ' đ'"></span>
                            <span th:unless="${db.tienCoc != null}" class="text-muted">—</span>
                        </td>
                        <td class="text-center">
                            <span class="badge"
                                  th:classappend="${db.trangThai == 'CHO_XAC_NHAN'} ? 'bg-warning text-dark' :
                                                  (${db.trangThai == 'DA_XAC_NHAN'} ? 'bg-success' :
                                                  (${db.trangThai == 'DA_HUY'} ? 'bg-danger' : 'bg-secondary'))"
                                  th:text="${db.trangThai == 'CHO_XAC_NHAN'} ? 'Chờ xác nhận' :
                                           (${db.trangThai == 'DA_XAC_NHAN'} ? 'Đã xác nhận' :
                                           (${db.trangThai == 'DA_HUY'} ? 'Đã hủy' :
                                           (${db.trangThai == 'HOAN_THANH'} ? 'Hoàn thành' : ${db.trangThai})))"></span>
                        </td>
                        <td class="text-center action-btns">
                            <!-- Sửa -->
                            <a th:href="@{/dat-ban/sua/{id}(id=${db.maDat})}"
                               class="btn btn-sm btn-outline-secondary mb-1" title="Sửa">
                                <i class="bi bi-pencil"></i>
                            </a>
                            <!-- Xác nhận - chỉ hiện khi CHO_XAC_NHAN -->
                            <form th:if="${db.trangThai == 'CHO_XAC_NHAN'}"
                                  th:action="@{/dat-ban/xac-nhan/{id}(id=${db.maDat})}" method="post">
                                <button type="submit" class="btn btn-sm btn-success mb-1" title="Xác nhận">
                                    <i class="bi bi-check-lg"></i> Xác nhận
                                </button>
                            </form>
                            <!-- Hủy - hiện khi CHO_XAC_NHAN hoặc DA_XAC_NHAN -->
                            <form th:if="${db.trangThai == 'CHO_XAC_NHAN' or db.trangThai == 'DA_XAC_NHAN'}"
                                  th:action="@{/dat-ban/huy/{id}(id=${db.maDat})}" method="post"
                                  onsubmit="return confirm('Hủy đặt bàn này?');">
                                <button type="submit" class="btn btn-sm btn-outline-danger mb-1" title="Hủy">
                                    <i class="bi bi-x-lg"></i> Hủy
                                </button>
                            </form>
                            <!-- Hoàn thành - chỉ hiện khi DA_XAC_NHAN -->
                            <form th:if="${db.trangThai == 'DA_XAC_NHAN'}"
                                  th:action="@{/dat-ban/hoan-thanh/{id}(id=${db.maDat})}" method="post">
                                <button type="submit" class="btn btn-sm btn-secondary mb-1" title="Hoàn thành">
                                    <i class="bi bi-flag"></i> Hoàn thành
                                </button>
                            </form>
                            <!-- Xóa - chỉ hiện khi DA_HUY hoặc HOAN_THANH -->
                            <form th:if="${db.trangThai == 'DA_HUY' or db.trangThai == 'HOAN_THANH'}"
                                  th:action="@{/dat-ban/xoa/{id}(id=${db.maDat})}" method="post"
                                  onsubmit="return confirm('Xóa vĩnh viễn đặt bàn này?');">
                                <button type="submit" class="btn btn-sm btn-outline-danger mb-1" title="Xóa">
                                    <i class="bi bi-trash"></i> Xóa
                                </button>
                            </form>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
        <div class="card-footer text-muted small">
            Tổng: <strong th:text="${#lists.size(danhSachDatBan)}">0</strong> đặt bàn
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
